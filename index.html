<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tap Tap Merdeka — Balap Karung</title>
<style>
  /* One 40 KB variable file covers every weight the design asks for (400-700),
     self-hosted so index.html still opens straight off the filesystem. */
  @font-face{
    font-family:"IBM Plex Sans";
    src:url("fonts/ibm-plex-sans-latin.woff2") format("woff2");
    font-weight:100 700;font-style:normal;font-display:swap;
  }

  :root{
    /* lifted from the Figma frame "DA Mystery Discount Box" (1749:2350) */
    --merah:#dd1f26;
    --merah-tua:#8f1419;
    --bg-dalam:#f35e64;
    --bg-tengah:#e83f45;
    --bg-luar:#dd1f26;
    --kuning-1:#fff3b6;
    --kuning-2:#ffde3b;
    --emas-bayang:#685020;      /* the badge's hard offset shadow */
    --ink:#311f17;
    --putih:#ffffff;
    /* badge border + shadow, overridden inside the ad lockup so the whole
       thing scales as one unit rather than each part clamping separately */
    --badge-b:6px;
    --badge-s:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg-luar);
            font-family:"IBM Plex Sans","Trebuchet MS",Verdana,system-ui,sans-serif;color:var(--ink)}
  #stage{position:fixed;inset:0;overflow:hidden;touch-action:manipulation}
  /* absolute, not a grid item: a percentage-sized canvas would otherwise be laid
     out from its own intrinsic ratio, and resizing would feed back into itself */
  canvas{position:absolute;inset:0;display:block;width:100%;height:100%}

  /* the ad's backdrop. It sits *behind* the canvas and is always on: it backs the
     menus (where render() skips the scene entirely) and it fills the letterbox
     strips above and below the race band on tall screens. */
  /* the plate is 3:2. Landscape crops a little sky off the top and dirt off the
     bottom; portrait matches on height, so the full sky-to-ground run survives
     and only the sides are lost — which is why it is centred rather than pinned.

     bg.jpg is the shipping encode of images/bg.png (q82, 4:2:0, progressive):
     275 KB against 2.4 MB. The plate has no transparency, so a JPEG needs none of
     the image-set()/type() machinery a WebP would to stay safe in older Safari.
     Re-export bg.png and this wants re-encoding with it. */
  #backdrop{position:absolute;inset:0;
            background:url("images/bg.jpg") 50% 50%/cover no-repeat,
                       linear-gradient(180deg,#1f74cf 0%,#7fb6e6 44%,#c9a066 100%)}
  /* the drawn race scene owns the band, so the letterbox strips step back */
  #stage.racing #backdrop{filter:brightness(.6) saturate(.85)}
  /* measured in JS: env() will not resolve through getComputedStyle on a custom
     property, but it does resolve on a real declaration */
  #safe{position:absolute;top:0;left:0;width:0;height:0;pointer-events:none;visibility:hidden;
        padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

  /* Scrolls rather than clips. A results card with four rows plus the prize can
     outgrow a short phone, and centred flex content overflows out of reach at
     BOTH ends — the auto margins centre it while it fits and release it when it
     does not, so the prize line can never be cropped off the bottom. */
  .layer{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;
         padding:clamp(12px,3vmin,32px);text-align:center;gap:clamp(10px,2.2vmin,22px);
         overflow-y:auto;overscroll-behavior:contain}
  .layer.on{display:flex}
  .layer > :first-child{margin-top:auto}
  .layer > :last-child{margin-bottom:auto}
  .layer.pass{pointer-events:none}
  .layer.pass > *{pointer-events:auto}

  .scrim{background:radial-gradient(120% 90% at 50% 40%,rgba(120,16,20,.42),rgba(48,10,12,.84))}

  /* the gold card: white keyline, 7px corner, hard shadow — Figma node 1749:2900 */
  .badge{background:linear-gradient(180deg,var(--kuning-1) 0%,var(--kuning-2) 100%);
         border:var(--badge-b) solid var(--putih);border-radius:7px;
         filter:drop-shadow(0 var(--badge-s) 0 var(--emas-bayang))}

  /* stands in for the wordmark's outline-and-shadow treatment on plain headings.
     Built from stacked shadows rather than -webkit-text-stroke: the stroke is
     centred on the glyph edge, so at this weight it swallows the red fill. */
  .display{font-weight:700;text-transform:uppercase;line-height:1.05;letter-spacing:.01em;
           color:var(--merah);
           text-shadow:-.055em -.055em 0 var(--putih), .055em -.055em 0 var(--putih),
                       -.055em  .055em 0 var(--putih), .055em  .055em 0 var(--putih),
                       -.078em 0 0 var(--putih), .078em 0 0 var(--putih),
                       0 -.078em 0 var(--putih), 0 .078em 0 var(--putih),
                       0 .17em 0 rgba(70,18,20,.32)}

  h2{font-size:clamp(20px,4.4vmin,44px)}

  /* ---- title screen ------------------------------------------------------- */
  /* --w is the *visible* width of the title art, and every size in the lockup is
     a ratio of it, so the whole composition scales as one unit instead of each
     part clamping alone.
     62vh is not arbitrary. The hero is bottom-anchored and the copy column is
     vertically centred, so the two only sit at the same height — the balance the
     mock has — at one ratio of --w to the viewport, and that ratio works out to
     .62. Change the hero width or the column's gaps and this wants re-deriving. */
  #scr-title{padding:0;gap:0;overflow:hidden}
  .title-wrap{--w:min(45vw,62vh,680px);
              display:flex;align-items:center;justify-content:center;
              gap:calc(var(--w) * .04);width:100%;height:100%;
              padding:0 clamp(10px,2.5vw,56px)}
  .title-copy{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
              gap:calc(var(--w) * .04)}
  /* the hero is bust-length at 450x700; .86x --w lands its head on the top of the
     title art once the overhang below is discounted */
  /* height:auto is load-bearing — the img carries width/height attributes so the
     layout is stable before it decodes, and without it the 700px attribute wins
     over the scaled width and the character stretches */
  .title-hero{flex:0 0 auto;width:calc(var(--w) * .86);height:auto;align-self:flex-end;
              margin-bottom:calc(var(--w) * -.12);
              filter:drop-shadow(0 .02em .45em rgba(46,24,10,.45));
              animation:bob 3.6s ease-in-out infinite}

  /* The title art is a 1536x1024 plate whose glyphs only occupy the box
     (43,114)-(1524,903) — 2.8% of the width is empty on the left and 11% of the
     height at top and bottom. Laid out raw that padding would push the ribbon a
     visible distance below the letters, so the element is sized to the plate and
     the dead bands are pulled back out with negative margins. Re-measure these
     four numbers if the art is ever re-exported.
       element width  = --w / .9642  = --w * 1.0371
       element height = width / 1.5  = --w * .6914
       top / bottom   = 11.04% / 11.82% of that height
     title.webp and title.png share those dimensions exactly, so the geometry holds
     whichever one the browser picks. */
  .wordmark{width:calc(var(--w) * 1.0371);aspect-ratio:1536/1024;
            margin:calc(var(--w) * -.0763) 0 calc(var(--w) * -.0817);
            filter:drop-shadow(0 calc(var(--w) * .004) calc(var(--w) * .012) rgba(30,10,12,.35))}
  .wordmark picture{display:block}
  .wordmark img{display:block;width:100%;height:auto}

  /* the objective banner. clip-path notches both ends into a ribbon, so the depth
     is a filter rather than a box-shadow: filters apply after the clip and follow
     the notched silhouette, where a box-shadow would trace the unclipped box.
     Sizes are in em off a --w-derived font-size, so the notch scales with it.

     Width and font-size are a matched pair, not two free numbers. The copy is
     26.3em set on one line and breaks best as 13.7em + 11.9em, and the stars plus
     padding cost 6.9em of the box, so two lines need width/font-size >= 20.6. At
     .80 / .034 the ratio is 23.5 — enough headroom that a fallback face with wider
     metrics still breaks in two. Change one number and the copy reflows to three. */
  .ribbon{font-size:calc(var(--w) * .034);
          display:flex;align-items:center;justify-content:space-between;gap:.75em;
          width:calc(var(--w) * .80);padding:.5em 1.5em;
          transform:rotate(-1.6deg);
          background:linear-gradient(180deg,#a8171d 0%,#780e13 100%);
          clip-path:polygon(0 0,100% 0,calc(100% - .8em) 50%,100% 100%,0 100%,.8em 50%);
          box-shadow:inset 0 .1em 0 rgba(255,255,255,.18);
          filter:drop-shadow(0 .1em 0 #4d080b) drop-shadow(0 .2em .3em rgba(34,6,8,.45))}
  /* flex:1 hands the span every pixel the stars do not need, which is what puts
     the stars out at the ends the way the mock has them */
  .ribbon span{flex:1;color:var(--putih);font-weight:700;text-transform:uppercase;
               line-height:1.14;letter-spacing:.02em;text-align:center;
               text-shadow:0 .07em 0 rgba(52,6,8,.5)}
  .ribbon i{flex:0 0 auto;font-style:normal;font-size:1.15em;line-height:1;
            color:var(--kuning-2);text-shadow:0 .06em 0 rgba(92,52,6,.6)}

  /* the pulse lives on the wrapper: the button's own transform is spoken for by
     :active, and the two would overwrite each other on the same property */
  .cta{display:flex;justify-content:center;animation:breathe 2.6s ease-in-out infinite}
  .pill{font:inherit;font-size:calc(var(--w) * .066);font-weight:700;cursor:pointer;
        text-transform:uppercase;letter-spacing:.07em;color:var(--putih);
        padding:.44em 1.5em;border-radius:999px;border:max(3px,.085em) solid var(--putih);
        background:linear-gradient(180deg,#f0353c 0%,#d8191f 54%,#af131a 100%);
        box-shadow:0 .16em 0 #8b1216,0 .3em .45em rgba(46,7,9,.45),
                   inset 0 .16em .02em rgba(255,255,255,.34),
                   inset 0 -.14em .02em rgba(0,0,0,.16);
        transition:transform .09s,box-shadow .09s}
  .pill:active{transform:translateY(.16em);
               box-shadow:0 0 0 #8b1216,0 .1em .2em rgba(46,7,9,.4),
                          inset 0 .16em .02em rgba(255,255,255,.22)}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

  /* ---- game chrome: round icon buttons, prize chip ------------------------ */
  #hud-top{position:absolute;z-index:420;display:flex;align-items:flex-start;
           gap:clamp(10px,1.5vw,20px);
           top:calc(clamp(12px,2.6vh,34px) + env(safe-area-inset-top,0px));
           right:clamp(14px,2.8vw,52px)}
  /* SVG rather than emoji: an emoji is a colour glyph, so `color` would not
     reach it and each platform would draw a different weight on the disc */
  .gbtn{display:flex;flex-direction:column;align-items:center;gap:.45em;
        background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--putih)}
  .gbtn i{display:grid;place-items:center;width:clamp(40px,4.2vw,78px);aspect-ratio:1;
          border-radius:999px;border:3px solid var(--putih);
          background:linear-gradient(180deg,#4b2c26 0%,#2a1412 100%);
          box-shadow:0 .12em 0 rgba(18,6,6,.6),0 .22em .5em rgba(24,6,8,.42),
                     inset 0 .12em 0 rgba(255,255,255,.18);
          transition:transform .09s}
  .gbtn.hot i{background:linear-gradient(180deg,#f0353c 0%,#bf151b 100%);
              box-shadow:0 .12em 0 #8b1216,0 .22em .5em rgba(24,6,8,.42),
                         inset 0 .12em 0 rgba(255,255,255,.26)}
  .gbtn:active i{transform:translateY(.1em)}
  .gbtn svg{width:54%;height:54%;stroke:var(--putih);fill:none;stroke-width:2;
            stroke-linecap:round;stroke-linejoin:round}
  /* white caption over a bright sky needs the shadow to stay readable */
  .gbtn b{font-size:clamp(9px,.72vw,14px);font-weight:700;letter-spacing:.08em;
          text-transform:uppercase;text-shadow:0 2px 3px rgba(20,6,8,.85)}

  /* one font-size drives the whole chip, so the tile, the copy and the chevron
     scale together instead of each clamping against the viewport on its own */
  #prize-chip{position:absolute;z-index:420;display:flex;align-items:center;gap:.7em;
              left:clamp(12px,2.6vw,44px);
              bottom:calc(clamp(12px,3vh,40px) + env(safe-area-inset-bottom,0px));
              cursor:pointer;font:inherit;font-size:clamp(12px,1vw,19px);
              text-align:left;color:var(--putih);border:0;
              padding:.55em .7em;border-radius:.85em;
              background:rgba(38,14,12,.66);
              box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22),
                         0 .4em .9em rgba(20,6,8,.45);
              -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #prize-chip .gift{display:grid;place-items:center;flex:0 0 auto;
                    width:2.3em;height:2.3em;border-radius:.45em;
                    background:linear-gradient(180deg,#f0353c,#bf151b);
                    box-shadow:0 2px 0 #8b1216}
  #prize-chip .gift svg{width:64%;height:64%;stroke:var(--putih);fill:none;stroke-width:2;
                        stroke-linecap:round;stroke-linejoin:round}
  #prize-chip .t{display:block;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
                 line-height:1.15}
  #prize-chip .a{display:block;margin-top:.15em;font-weight:600;font-size:.9em;
                 line-height:1.15;color:rgba(255,255,255,.78)}
  #prize-chip .a b{color:var(--kuning-2);font-size:1.2em}
  #prize-chip .chev{display:none;flex:0 0 auto;margin-left:auto;padding-left:.5em}
  #prize-chip .chev svg{display:block;width:1.4em;height:1.4em;
                        stroke:rgba(255,255,255,.75);fill:none;stroke-width:2.4;
                        stroke-linecap:round;stroke-linejoin:round}

  /* portrait: the mock's phone layout — wordmark, ribbon, character, CTA riding up
     over the sack, prize bar across the bottom. Both icon buttons stay in the top
     row here rather than one dropping below the CTA: with only two of them a lone
     button under MULAI reads as an orphan, and keeping them together means one copy
     of each in the markup instead of a per-breakpoint duplicate.
     display:contents flattens .title-copy so the hero can be ordered between its
     children; the hero then flex-shrinks, which is what guarantees no overflow
     on a short phone regardless of how the rest of the column measures out. */
  @media (max-width:900px) and (min-height:561px){
    .title-wrap{--w:min(84vw,38vh);flex-direction:column;justify-content:center;
                gap:calc(var(--w) * .03);
                padding:calc(var(--w) * .26) clamp(10px,3.5vw,20px) calc(var(--w) * .34)}
    .title-copy{display:contents}
    .wordmark{order:1}
    /* .96/.042 keeps the same width-to-font-size ratio the desktop rule derives */
    .ribbon{order:2;width:calc(var(--w) * .96);font-size:calc(var(--w) * .042)}
    /* driven by height, not width: vertical room is what is scarce in a phone
       column, and object-fit:contain catches the case where even this has to
       shrink so the character scales instead of stretching */
    .title-hero{order:3;height:calc(var(--w) * 1.18);width:auto;max-width:100%;
                align-self:center;margin:0;
                flex:0 1 auto;min-height:0;object-fit:contain;object-position:50% 100%;
                animation-duration:4.2s}
    .cta{order:4;z-index:2;margin-top:calc(var(--w) * -.12)}
    .pill{font-size:calc(var(--w) * .085);padding:.42em 1.4em}
    #hud-top{top:calc(clamp(8px,1.8vh,16px) + env(safe-area-inset-top,0px));
             right:clamp(10px,3.5vw,18px)}
    #prize-chip{left:clamp(10px,3.5vw,18px);right:clamp(10px,3.5vw,18px);
                bottom:calc(clamp(10px,1.8vh,18px) + env(safe-area-inset-bottom,0px));
                font-size:clamp(13px,3.6vw,17px);padding:.6em .7em}
    #prize-chip .chev{display:grid}
  }

  /* short landscape — a phone on its side, or a squat desktop window. The row
     layout still reads best here; it only needs to shrink. */
  @media (max-height:560px){
    .title-wrap{--w:min(34vw,68vh)}
    .ribbon{width:calc(var(--w) * .94);font-size:calc(var(--w) * .04)}
  }

  /* ---------------------------------------------------------------- buttons */
  .btn{border:var(--badge-b) solid var(--putih);cursor:pointer;font:inherit;font-weight:700;
       letter-spacing:.05em;text-transform:uppercase;border-radius:7px;
       padding:clamp(9px,1.8vmin,15px) clamp(20px,4vmin,36px);
       background:linear-gradient(180deg,var(--kuning-1) 0%,var(--kuning-2) 100%);
       color:var(--ink);font-size:clamp(14px,2.4vmin,22px);
       box-shadow:0 var(--badge-s) 0 var(--emas-bayang);
       transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(var(--badge-s));box-shadow:0 0 0 var(--emas-bayang)}
  .btn.merah{background:var(--merah);color:var(--putih);box-shadow:0 var(--badge-s) 0 var(--merah-tua)}
  .btn.merah:active{box-shadow:0 0 0 var(--merah-tua)}
  .btn.ghost{background:var(--putih);color:var(--merah);box-shadow:0 var(--badge-s) 0 #b99a6a}
  .btn.ghost:active{box-shadow:0 0 0 #b99a6a}
  /* the UA ring is near-invisible on the red fills, and the title screen is now
     mostly buttons — give keyboard focus something that reads on every surface */
  .btn:focus-visible,.pill:focus-visible,.arrow:focus-visible,
  #prize-chip:focus-visible,#mute:focus-visible{outline:3px solid var(--kuning-2);outline-offset:3px}
  .gbtn:focus-visible{outline:0}
  .gbtn:focus-visible i{outline:3px solid var(--kuning-2);outline-offset:3px}

  /* -------------------------------------------------- hadiah / pengaturan card */
  /* not routed through show(): these sit *over* whichever screen is up, so the
     title art stays behind them instead of being swapped out */
  #scr-modal{z-index:500;background:rgba(30,8,10,.7);
             -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .modal-card{width:min(92vw,440px);max-height:86vh;overflow-y:auto;
              padding:clamp(18px,3.4vmin,30px);border-radius:12px;
              display:flex;flex-direction:column;gap:clamp(10px,2vmin,16px)}
  .modal-card h2{font-size:clamp(19px,3.6vmin,30px);color:var(--merah);text-transform:uppercase;
                 text-align:center;line-height:1.05;text-shadow:0 .06em 0 rgba(104,80,32,.25)}
  /* the card's own gap only separates heading / body / button; the body's blocks
     need their own, or the footnote reads as part of the last step */
  #modal-body{display:flex;flex-direction:column;gap:clamp(9px,1.8vmin,15px)}
  .modal-card .lead{font-weight:600;text-align:center;font-size:clamp(13px,2.2vmin,17px)}
  .modal-card .lead b{color:var(--merah)}
  .modal-card .fine{font-weight:600;text-align:center;color:#7a5a2c;
                    font-size:clamp(11px,1.8vmin,14px)}
  .steps{display:flex;flex-direction:column;gap:.55em;text-align:left;
         font-size:clamp(12px,2vmin,16px);font-weight:600;counter-reset:s}
  .steps li{list-style:none;display:flex;gap:.6em;align-items:baseline}
  .steps li::before{counter-increment:s;content:counter(s);flex:0 0 auto;
                    display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:999px;
                    background:var(--merah);color:var(--putih);font-size:.82em}
  /* white row, red control: the default gold .btn on the card's own gold gradient
     had almost no edge to it */
  .switch{display:flex;align-items:center;justify-content:space-between;gap:1em;
          padding:.5em .5em .5em .9em;border-radius:9px;background:var(--putih);
          font-weight:700;font-size:clamp(13px,2.2vmin,17px)}
  .switch .btn{padding:.45em 1.1em;font-size:.9em;--badge-b:3px;--badge-s:3px;min-width:5.5em}

  /* ---------------------------------------------------- email / lead capture */
  .email-card{width:min(92vw,520px);padding:clamp(18px,3.4vmin,32px);border-radius:10px;
              display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vmin,14px)}
  /* not .display: the white outline is there to lift text off the busy photo
     backdrop, and on the gold card it just muddies the letterforms */
  .email-card p.email-sub{color:var(--ink);font-weight:600;margin-bottom:.15em;
                          font-size:clamp(13px,2.2vmin,18px)}
  .email-card h2{font-size:clamp(20px,4vmin,36px);color:var(--merah);text-transform:uppercase;
                 line-height:1.05;text-shadow:0 .06em 0 rgba(104,80,32,.25)}
  #email-form{display:flex;flex-direction:column;gap:clamp(8px,1.6vmin,14px);width:100%;align-items:stretch}
  #email-input{font:inherit;font-weight:600;font-size:clamp(15px,2.4vmin,20px);color:var(--ink);
               padding:clamp(10px,1.9vmin,16px) clamp(12px,2.2vmin,18px);
               border:3px solid var(--putih);border-radius:7px;background:rgba(255,255,255,.92);
               box-shadow:inset 0 2px 0 rgba(104,80,32,.18);width:100%;text-align:center}
  #email-input::placeholder{color:#a08a63;font-weight:600}
  #email-input:focus{outline:0;border-color:var(--merah);background:#fff}
  #email-input.bad{border-color:var(--merah);background:#fff2f2}
  #btn-email[disabled]{opacity:.6;cursor:progress}
  .email-note{min-height:1.4em;font-weight:600;text-align:center;
              font-size:clamp(11px,1.9vmin,15px);color:#7a5a2c}
  .email-note.bad{color:var(--merah-tua)}

  /* ---- picker: a slider, one racer at a time, neighbours peeking in ------ */
  /* the hero portraits are bust-length and much taller than they are wide, so
     the frame is roomier than it was for the full-body vector sprites */
  #carousel{position:relative;width:min(94vw,720px);height:clamp(190px,44vmin,390px);
            touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
  #carousel.grabbing{cursor:grabbing}
  /* pool of light the chosen racer stands in */
  #plinth{position:absolute;left:50%;bottom:-3%;width:clamp(150px,30vmin,270px);height:clamp(28px,5.6vmin,52px);
          transform:translateX(-50%);border-radius:50%;pointer-events:none;
          background:radial-gradient(closest-side,rgba(255,222,59,.62),rgba(255,222,59,.16) 62%,rgba(255,222,59,0))}
  #track{position:absolute;inset:0}
  .slide{position:absolute;left:50%;bottom:0;top:0;width:clamp(130px,27vmin,250px);
         transform-origin:50% 100%;display:flex;align-items:flex-end;justify-content:center;
         will-change:transform,opacity;
         transition:transform .34s cubic-bezier(.22,.9,.26,1),opacity .34s,filter .34s}
  #track.dragging .slide{transition:none}
  .slide img{width:100%;height:100%;object-fit:contain;object-position:bottom;pointer-events:none;
             filter:drop-shadow(0 .45em .5em rgba(0,0,0,.45))}
  .slide.on img{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}

  .arrow{position:absolute;top:50%;z-index:200;border:3px solid var(--putih);cursor:pointer;font:inherit;font-weight:700;
         width:clamp(34px,5.6vmin,50px);height:clamp(34px,5.6vmin,50px);border-radius:999px;
         background:var(--putih);color:var(--merah);font-size:clamp(20px,3.4vmin,30px);line-height:1;
         box-shadow:0 .16em 0 rgba(104,80,32,.55);transform:translateY(-50%);transition:opacity .2s}
  .arrow:active{transform:translateY(-46%) scale(.93)}
  .arrow.dim{opacity:.28;pointer-events:none}
  #prev{left:0} #next{right:0}

  #nameplate{padding:calc(var(--badge-b) * .8) 1.5em;text-align:center}
  #nameplate b{display:block;color:var(--ink);font-size:clamp(19px,3.6vmin,32px);letter-spacing:.03em;
               text-transform:uppercase}
  #nameplate.pop{animation:pop .3s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(7px) scale(.96)}to{opacity:1;transform:none}}

  #dots{display:flex;gap:8px}
  #dots button{border:0;padding:0;cursor:pointer;width:9px;height:9px;border-radius:999px;
               background:rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(104,80,32,.4);
               transition:width .22s,background .22s}
  #dots button.on{width:26px;background:var(--kuning-2)}

  #tapzone{position:absolute;inset:0;display:none}
  #tapzone.on{display:block}

  /* --------------------------------------------------------- the reveal ---- */
  /* The payoff screen, dressed as the campaign key visual: trophy and ribbon over
     the gold card, the figure on a ticket stub, the perks as chips, the race
     result on a navy panel, and the claim line under it all.

     The whole stack lives inside #reveal so it scrolls as one unit, and the auto
     block margins are spelled out here rather than left to
     `.layer > :first-child/:last-child` — #konfeti is a sibling, so #reveal is
     neither. Same effect either way: centred while it fits, released when it does
     not, so the figure can never be cropped off a short phone. */
  /* --cw is the card's width; --ts is the scale every size in the reveal is a
     ratio of, so the whole composition scales as one unit instead of each part
     clamping against the viewport on its own — the same trick the title lockup
     plays with --w, and for the same reason. It also keeps the type off vmin,
     which on a tall phone is the width anyway and on a short landscape window is
     the wrong axis entirely. The ratios come off the campaign key visual,
     measured against its 1082px frame.

     The two are separate because a short landscape window needs a card that is
     wide and type that is small — one variable cannot do both. Everywhere else
     --ts is just --cw. Only --pad stays on --cw: it is a width, not a type size. */
  #reveal{--cw:min(94vw,455px);
          /* 74vh is the height cap. On a portrait phone it never binds (74vh is
             larger than the card is wide), so the scale is just --cw; it exists
             for the squat window, where an uncapped card ran past the fold.
             Measured, not chosen: 80vh overflows a 740x360 window by 7px. */
          --ts:min(var(--cw),74vh);
          --crest:calc(var(--ts) * .34);
          position:relative;z-index:1;margin-top:auto;margin-bottom:auto;
          display:flex;flex-direction:column;align-items:center;
          width:var(--cw);gap:clamp(9px,1.9vmin,16px);
          /* pays for the trophy's overhang, which would otherwise land in the
             scroll container's unreachable top overflow */
          padding-top:calc(var(--crest) * .6)}

  #results{--pad:calc(var(--cw) * .04);
           position:relative;width:100%;border-radius:12px;
           display:flex;flex-direction:column;gap:clamp(7px,1.5vmin,13px);
           padding:calc(var(--crest) * .2) var(--pad) var(--pad)}

  /* The trophy hangs out of the top of the card, and its base is *meant* to
     disappear behind the banner the way it does in the key visual: #verdict comes
     after this in the markup and both paint at z-index auto, so document order
     alone puts the ribbon in front.

     .badge's drop-shadow filter already makes #results a containing block for
     this; position:relative says so out loud, and means the card lends the trophy
     its hard gold shadow too. */
  #crest{position:absolute;left:50%;top:calc(var(--crest) * -.6);
         width:var(--crest);height:var(--crest);transform:translateX(-50%);
         pointer-events:none;
         animation:crest-in .45s .08s cubic-bezier(.2,1.5,.4,1) both}
  #crest svg{display:block;width:100%;height:100%;overflow:visible}
  @keyframes crest-in{from{opacity:0;transform:translateX(-50%) scale(.55) translateY(22%)}
                        to{opacity:1;transform:translateX(-50%) scale(1)}}

  /* the SELAMAT banner — the title screen's .ribbon language (notched ends, red
     gradient, hard shadow) sized off its own font-size so the notch scales with
     the copy rather than against the viewport */
  /* pulled out to the card's border edge, so the banner reads as laid over the
     card rather than set inside its padding */
  #verdict{align-self:stretch;margin:0 calc(var(--pad) * -1);
           padding:.28em 1.4em;text-align:center;
           font-size:calc(var(--ts) * .088);font-weight:700;line-height:1.1;
           text-transform:uppercase;letter-spacing:.02em;color:var(--putih);
           background:linear-gradient(180deg,#e8262d 0%,#c4151b 52%,#9d1015 100%);
           clip-path:polygon(0 0,100% 0,calc(100% - .5em) 50%,100% 100%,0 100%,.5em 50%);
           box-shadow:inset 0 .08em 0 rgba(255,255,255,.26);
           filter:drop-shadow(0 .09em 0 #6d0b0f) drop-shadow(0 .17em .26em rgba(40,6,8,.42));
           text-shadow:0 .055em 0 rgba(58,6,8,.5)}

  #meraih{display:flex;align-items:center;justify-content:center;gap:.7em;
          color:#7a5320;font-weight:700;text-transform:uppercase;letter-spacing:.16em;
          font-size:clamp(10px,1.75vmin,14px)}
  #meraih::before,#meraih::after{content:"";width:1.5em;height:2px;border-radius:2px;
                                 background:rgba(122,83,32,.45)}

  /* The figure sits on a ticket stub, scalloped down both long edges. That is a
     mask, not a border-image: two layers, each covering just over half the width
     and scalloped along its own outer edge, which the default `add` compositing
     unions back into a full box. A browser without mask support gets the plain
     rounded rectangle — which is why none of the depth here is an outer
     box-shadow, since the mask would clip one. */
  #ticket{display:flex;flex-direction:column;align-items:center;
          padding:.65em .95em .8em;border-radius:9px;
          background:linear-gradient(180deg,#ffe98a 0%,#ffd233 46%,#f7b81e 100%);
          box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),
                     inset 0 .1em 0 rgba(255,255,255,.55),
                     inset 0 -.12em 0 rgba(150,96,10,.26);
          -webkit-mask:radial-gradient(circle at left,#0000 5px,#000 5.5px) left/51% 15px repeat-y,
                       radial-gradient(circle at right,#0000 5px,#000 5.5px) right/51% 15px repeat-y;
          mask:radial-gradient(circle at left,#0000 5px,#000 5.5px) left/51% 15px repeat-y,
               radial-gradient(circle at right,#0000 5px,#000 5.5px) right/51% 15px repeat-y;
          animation:tkt .42s .48s cubic-bezier(.2,1.4,.45,1) both}
  @keyframes tkt{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  #ticket .th{display:flex;align-items:center;gap:.5em;color:#7a2418;font-weight:700;
              text-transform:uppercase;letter-spacing:.14em;
              font-size:clamp(11px,1.95vmin,15px)}
  #ticket .th i{font-style:normal;color:var(--merah);font-size:1.1em;line-height:1}

  /* the payoff figure. Hard offset shadow, no white outline: .display's outline
     is there to lift red off the photo backdrop, and on gold it only muddies.
     flex-start rather than baseline — the key visual hangs the "Rp" from the top
     of the digits, and a shared baseline would drop it to their feet. */
  #prize-amount{display:flex;align-items:flex-start;justify-content:center;gap:.06em;
                margin:.1em 0 .2em;color:var(--merah);font-weight:700;line-height:1;
                letter-spacing:-.015em;
                text-shadow:0 .03em 0 #fff6cc,.012em .055em 0 #a8161c,
                            0 .085em 0 rgba(108,26,18,.55),0 .1em .1em rgba(80,20,14,.3)}
  #prize-amount .rp{font-size:calc(var(--ts) * .058);letter-spacing:.02em;
                    margin-top:.14em}
  #prize-amount .n{font-size:calc(var(--ts) * .128)}
  /* a prize the parser does not recognise prints verbatim: prose, not a figure */
  #prize-amount.text{display:block;text-align:center;letter-spacing:0;line-height:1.2;
                     font-size:clamp(14px,2.5vmin,21px);
                     text-shadow:0 .04em 0 rgba(122,36,24,.28)}
  #prize-tier{padding:.3em 1.05em;border-radius:999px;color:var(--putih);
              background:linear-gradient(180deg,#e8262d,#bf1419);
              font-weight:700;text-transform:uppercase;letter-spacing:.09em;
              font-size:calc(var(--ts) * .034);
              box-shadow:0 .14em 0 rgba(122,36,24,.45)}
  /* SWE's prizes are two figures summed into one total, so the split is spelled
     out — otherwise the headline is a number the player cannot check against the
     landing page */
  #prize-break{margin-top:.45em;text-align:center;color:#7a2418;font-weight:600;
               line-height:1.25;font-size:clamp(9.5px,1.65vmin,13px)}
  #prize-break:empty{display:none}

  /* the extras that came with the figure. Chips rather than a run-on line: the
     sheet joins them with "+", and that is exactly how they read. */
  /* the size lives here rather than on .perk so the "+" between the chips scales
     with them — as a sibling it would otherwise inherit the page's base size and
     sit there twice as big as the text it joins */
  #perks{font-size:calc(var(--ts) * .031);
         display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
         gap:.45em .55em;padding:.55em .7em;border-radius:9px;
         background:rgba(255,255,255,.9);
         box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 .1em 0 rgba(150,96,10,.16)}
  #perks:empty{display:none}
  #perks .perk{display:flex;align-items:center;gap:.5em;text-align:left;
               font-weight:700;text-transform:uppercase;line-height:1.12;color:#123a6b}
  #perks .perk.kuning{color:#7a2418}
  #perks .perk i{flex:0 0 auto;display:grid;place-items:center;
                 width:2.1em;height:2.1em;border-radius:.4em}
  #perks .perk.biru i{background:linear-gradient(180deg,#3574d4,#183f86);
                      box-shadow:0 2px 0 rgba(10,30,70,.4)}
  #perks .perk.kuning i{background:linear-gradient(180deg,#ffd233,#f0a413);
                        box-shadow:0 2px 0 rgba(150,96,10,.45)}
  #perks .perk i svg{width:66%;height:66%;stroke:var(--putih);fill:none;stroke-width:2.1;
                     stroke-linecap:round;stroke-linejoin:round}
  #perks .plus{flex:0 0 auto;display:grid;place-items:center;width:1.5em;height:1.5em;
               border-radius:999px;background:var(--merah);color:var(--putih);
               font-weight:700;line-height:1;box-shadow:0 2px 0 rgba(122,20,25,.45)}

  /* carries the card's own gap, so stacking the panel and the strip inside a
     wrapper lays out exactly as it did when they were siblings */
  #side{display:flex;flex-direction:column;gap:clamp(7px,1.5vmin,13px)}

  /* the race result. Navy, because it has to read as data next to all that gold. */
  #stats{display:flex;align-items:stretch;border-radius:9px;color:var(--putih);
         background:linear-gradient(180deg,#26406e 0%,#152540 100%);
         box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 .1em 0 rgba(150,96,10,.18)}
  #stats > div{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;
               padding:.55em .5em}
  #stats .rank{gap:.4em}
  #stats .por{height:clamp(30px,5.6vmin,46px);width:auto;object-fit:contain;
              object-position:bottom;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
  #stats .medal{display:grid;place-items:center;flex:0 0 auto;
                width:1.95em;height:1.95em;border-radius:999px;
                font-weight:700;font-size:clamp(11px,2vmin,16px);color:#5a3c08;
                background:linear-gradient(180deg,#ffe27a,#d99a10);
                box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 2px 0 rgba(0,0,0,.32)}
  #stats .medal.m2{color:#3d4650;background:linear-gradient(180deg,#f4f7fa,#aeb8c4)}
  #stats .medal.m3{color:#5a3218;background:linear-gradient(180deg,#eab68b,#b06a34)}
  #stats .medal.m4{color:#39434f;background:linear-gradient(180deg,#e0e5ea,#98a4b2)}
  #stats .rank b{font-size:calc(var(--ts) * .072);line-height:1;letter-spacing:-.02em}
  /* a hairline rule rather than a border: the panel's corners are rounded, and a
     border on the second cell would show through them */
  #stats .time{flex-direction:column;gap:.08em;
               box-shadow:inset 1.5px 0 0 rgba(255,255,255,.15)}
  #stats .time .k{color:var(--kuning-2);font-weight:700;text-transform:uppercase;
                  letter-spacing:.12em;font-size:clamp(8.5px,1.5vmin,12px)}
  #stats .time .v{display:flex;align-items:center;gap:.35em}
  #stats .time .v svg{flex:0 0 auto;width:clamp(15px,3vmin,26px);height:clamp(15px,3vmin,26px);
                      stroke:var(--kuning-2);fill:none;stroke-width:2;
                      stroke-linecap:round;stroke-linejoin:round}
  #stats .time .v b{font-size:calc(var(--ts) * .072);line-height:1;letter-spacing:-.02em}
  #stats .time .v em{font-style:normal;font-weight:700;text-transform:uppercase;
                     letter-spacing:.1em;color:rgba(255,255,255,.68);
                     font-size:clamp(8.5px,1.5vmin,12px)}

  /* the field, compressed to the player and whoever they were actually racing:
     four full rows was more board than the payoff needs, and it pushed the
     figure off a short phone */
  #strip{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
         gap:.28em .4em;padding-top:.1em;
         font-weight:700;color:#6b4a1e;font-size:calc(var(--ts) * .029)}
  #strip .e{display:flex;align-items:center;gap:.4em;padding:.25em .6em;
            border-radius:999px;white-space:nowrap}
  #strip .e.me{background:var(--kuning-2);color:#5a3708;
               box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 2px 0 rgba(150,96,10,.3)}
  #strip .p{color:var(--merah)}
  #strip .e.me .p{color:var(--merah-tua)}
  #strip .sep{color:rgba(107,74,30,.4)}

  /* the one thing the old card had no line for: what happens next */
  #claim{display:flex;align-items:center;justify-content:center;gap:.6em;
         color:var(--putih);font-weight:700;line-height:1.3;text-align:center;
         font-size:calc(var(--ts) * .04);
         text-shadow:0 .08em .18em rgba(30,6,8,.7)}
  /* 16em is where the copy settles into two even lines rather than orphaning
     "kamu!" on a third; text-wrap:balance evens them out where it is supported
     and is harmless where it is not */
  #claim span{max-width:16em;text-wrap:balance}
  #claim::before,#claim::after{content:"";flex:0 0 auto;width:1.05em;height:1.7em;
    background:repeating-linear-gradient(102deg,var(--kuning-2) 0 .15em,#0000 .15em .45em)}
  #claim::after{transform:scaleX(-1)}

  /* A one-shot burst over the scrim. The scene's own confetti is still drifting
     on the canvas behind the card, but it sits under the scrim and reads as
     background — this is the layer that lands with the prize sting. The pieces
     are rebuilt on every reveal so a replay re-fires it. */
  #konfeti{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  #konfeti i{position:absolute;top:-10%;display:block;width:.7em;height:1.15em;
             border-radius:1px;animation:fall linear both}
  @keyframes fall{from{transform:translateY(0) rotate(0)}
                    to{transform:translateY(122vh) rotate(760deg)}}

  /* Wide and short — a phone on its side, or a squat desktop window. This is not
     an edge case: the race is a horizontal chase and portrait letterboxes it, so a
     phone on its side is the orientation the game expects, and the reveal has to
     land there too. The card is poster-shaped, and one column of it does not fit
     in ~330px of height however far the type is scaled down.

     So the figure and the result go side by side, which buys back most of the
     height the single column was spending. The layer's own padding and the
     layer's own padding does not scale with --ts, and at this height it is a big
     enough fraction of the budget to be worth trimming too. */
  @media (max-height:620px) and (min-width:520px){
    /* 52vh is measured, not chosen: it is where the tallest of these layouts
       (568x320, the smallest landscape phone still worth supporting) stops
       needing to scroll. */
    #reveal{--ts:min(40vw,300px,94vh);--cw:min(96vw,calc(var(--ts) * 2.5));
            gap:clamp(6px,1.2vmin,11px)}
    #scr-done{padding:clamp(8px,1.6vmin,16px)}
    #results{display:grid;grid-template-columns:1fr 1fr;
             column-gap:var(--pad);row-gap:clamp(5px,1.1vmin,10px)}
    /* the banner and its kicker still read across the whole card */
    #verdict,#meraih{grid-column:1/-1}
    #ticket{grid-column:1;grid-row:3}
    #perks {grid-column:1;grid-row:4}
    /* one cell spanning both rows, and start rather than stretch: the right
       column is much shorter than the ticket beside it, so sharing the ticket's
       rows would strand the strip at the bottom of the card */
    #side  {grid-column:2;grid-row:3/span 2;align-self:start}
  }

  /* the frame places it at 116px on 1920 wide, 50/55 in from the corner */
  /* above the picker slides, which layoutPicker() stacks up to z-index 100 */
  #brandmark{position:absolute;top:clamp(10px,2.9vw,55px);left:clamp(10px,2.6vw,50px);z-index:400;
             width:clamp(38px,6vw,116px);height:auto;pointer-events:none;
             filter:drop-shadow(0 2px 5px rgba(90,10,14,.3))}
  #stage.racing #brandmark{display:none}
  /* red disc with a white keyline — the same pill language as the drawn HUD */
  #mute{position:absolute;top:clamp(8px,1.6vmin,16px);right:clamp(8px,1.6vmin,16px);z-index:400;cursor:pointer;
        display:grid;place-items:center;padding:0;
        background:#c9171e;color:var(--putih);border:3px solid var(--putih);border-radius:999px;
        width:clamp(34px,5vmin,46px);height:clamp(34px,5vmin,46px);
        box-shadow:0 3px 0 rgba(112,10,14,.55)}
  #mute svg{width:56%;height:56%;stroke:currentColor;fill:none;stroke-width:2;
            stroke-linecap:round;stroke-linejoin:round}
  #stage.racing #mute{box-shadow:0 3px 0 rgba(112,10,14,.75)}
  /* the title screen carries sound inside Pengaturan, so the floating disc there
     would just be a second control for the same thing */
  #stage.titling #mute{display:none}
  /* no "please rotate your phone" nag: portrait letterboxes the race instead */
  .fade{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* the race itself is canvas-driven and unaffected; this only stills the idle
     decoration — the hero's bob, the CTA pulse, the picker bob */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
                         transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="safe" aria-hidden="true"></div>
  <!-- behind the canvas: it backs the menus, and shows through the letterbox
       strips once the race is banded -->
  <div id="backdrop"></div>
  <canvas id="game"></canvas>

  <div class="layer on" id="scr-title">
    <div class="title-wrap">
      <div class="title-copy">
        <!-- 178 KB WebP against a 1.6 MB PNG. The art is a wide flat gradient, so
             a 256-colour palette PNG is not an option — it bands visibly across the
             letter faces where WebP stays smooth. The PNG stays as the fallback and
             as the source art; a WebP-capable browser never fetches it. -->
        <h1 class="wordmark">
          <picture>
            <source srcset="images/title.webp" type="image/webp">
            <img src="images/title.png" width="1536" height="1024" alt="Tap Tap Merdeka">
          </picture>
        </h1>
        <p class="ribbon"><i>★</i><span>Tap secepat mungkin dan raih skor tertinggi!</span><i>★</i></p>
        <div class="cta"><button class="pill" id="btn-play">Mulai</button></div>
      </div>
      <img class="title-hero" src="sprites/adik_hero.png" width="450" height="700" alt="">
    </div>

    <div id="hud-top">
      <button class="gbtn hot" data-nav="hadiah" aria-label="Hadiah">
        <i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8"/><rect x="2.4" y="7" width="19.2" height="5" rx="1"/><path d="M12 7v14M12 7S9.6 7 8.2 5.6 8.7 2.2 10.1 2.8 12 7 12 7zM12 7s2.4 0 3.8-1.4S15.3 2.2 13.9 2.8 12 7 12 7z"/></svg></i>
        <b>Hadiah</b>
      </button>
      <button class="gbtn" data-nav="settings" aria-label="Pengaturan">
        <i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.2a1.5 1.5 0 0 1 1.5 1.5v.6a1.5 1.5 0 0 0 2.2 1.1l.5-.3a1.5 1.5 0 0 1 2 .6l.4.7a1.5 1.5 0 0 1-.5 2l-.5.3a1.5 1.5 0 0 0 0 2.6l.5.3a1.5 1.5 0 0 1 .5 2l-.4.7a1.5 1.5 0 0 1-2 .6l-.5-.3a1.5 1.5 0 0 0-2.2 1.1v.6a1.5 1.5 0 0 1-1.5 1.5h-.8a1.5 1.5 0 0 1-1.5-1.5v-.6a1.5 1.5 0 0 0-2.2-1.1l-.5.3a1.5 1.5 0 0 1-2-.6l-.4-.7a1.5 1.5 0 0 1 .5-2l.5-.3a1.5 1.5 0 0 0 0-2.6l-.5-.3a1.5 1.5 0 0 1-.5-2l.4-.7a1.5 1.5 0 0 1 2-.6l.5.3a1.5 1.5 0 0 0 2.2-1.1v-.6A1.5 1.5 0 0 1 11.2 2.2z"/></svg></i>
        <b>Pengaturan</b>
      </button>
    </div>

    <button id="prize-chip" data-nav="hadiah">

<script>
"use strict";

/* ------------------------------------------------------------------ data -- */

const CHARS = [
  {id:"bapak", name:"Bapak"},
  {id:"ibu",   name:"Ibu"},
  {id:"adik",  name:"Adik"},
  {id:"kakak", name:"Kakak"},
];
const POSES = ["stand","ready","jump"];

const RACE_LEN   = 2400;   // world px from start line to finish line
const HOP_TIME   = 0.30;   // seconds airborne
const HOP_DIST   = 62;     // world px covered per hop
const PERFECT    = 0.18;   // tap this soon after landing for a combo
const BUFFER     = 0.10;   // a tap this close before landing still counts
const COMBO_MAX  = 12;
const RUNOUT     = 520;    // world px of track past the finish line
const START_X    = 170;   // racers line up here, so the start gate stays in frame
const CAM_MIN    = -170;

/* the same tokens the stylesheet uses, so the drawn HUD and the DOM chrome
   stay one design rather than two that drift apart */
const FONT      = '"IBM Plex Sans","Trebuchet MS",sans-serif';
const MERAH     = "#dd1f26";
const MERAH_TUA = "#8f1419";
const KUNING_1  = "#fff3b6";
const KUNING_2  = "#ffde3b";
const EMAS_BAYANG = "#685020";
const INK       = "#311f17";
const PUTIH     = "#ffffff";

const img = {};            // "bapak_stand" -> Image

/* ------------------------------------------------------------- boilerplate */

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a) * t;
const rnd   = (a,b) => a + Math.random() * (b-a);

/* ---------------------------------------------- campaign variant + lead capture */

/* Paste the Apps Script web app /exec URL here — see tools/apps-script/Code.gs.
   Left empty the game still plays, but it draws the prize locally: nothing is
   recorded and one-play-per-email is not enforced. Fine for development, never
   for a live campaign. */
const LEAD_ENDPOINT = "https://script.google.com/macros/s/AKfycbyFxWRm-h0KbJyovYh2DoTkdkIviHLfK0Lt__5QvCKA0NbTwcm3XCeqipFPAXH7lYGZQA/exec";

/* /swe serves the SWE prize table, everything else DA. The host rewrites /swe/*
   to this same file (see README > Variants), so the path is the only signal. */
const VARIANT = /(^|\/)swe(\/|$)/i.test(location.pathname) ? "swe" : "da";

/* The headline figure, which differs per variant: SWE tops out at 3.5 juta early
   bird + 1.5 juta, DA at 2 juta. Quoted in one place so the title chip and the
   Hadiah panel can never drift apart or advertise the other track's number. */
const DISKON_MAX = VARIANT === "swe" ? "Rp5.000.000" : "Rp2.000.000";

/* Development mirror of the table in Code.gs, used only when LEAD_ENDPOINT is
   empty. Code.gs is the source of truth — the live page never sees the weights. */
const DEV_PRIZES = {
  da: [
    ["Early Bird 2 juta + BNSP + Exclusive Starter Kit", 30],
    ["Early Bird 2 juta + BNSP", 40],
    ["Early Bird 2 juta + BNSP + Exclusive AI Class Library", 30],
  ],
  swe: [
    ["Early Bird 3.5 juta + 1.5 juta", 10],
    ["Early Bird 3.5 juta + 1 juta", 70],
    ["Early Bird 3.5 juta + 500rb", 20],
  ],
};

/* Decided once, at the email step, before the race starts.

   The reveal is the entire point of the campaign, so the prize is treated as
   sticky rather than as a variable that happens to survive: whatever the
   endpoint hands back is normalised to a trimmed string (a missing field, a
   null, or a number from the sheet all used to collapse the reveal silently),
   and it is mirrored into sessionStorage so a reload mid-run — routine on
   mobile Safari, which discards backgrounded pages — cannot lose a prize the
   sheet has already recorded. */
let prize = "";
const PRIZE_KEY = "ttm-prize-" + VARIANT;
/* Shown only if we somehow reach the results with nothing: the row is already
   written server-side at that point, so the player is owed a prize either way
   and the card must not come up blank. */
const PRIZE_FALLBACK = "Sudah dikunci — cek emailmu untuk detailnya";

function setPrize(v){
  prize = typeof v === "string" ? v.trim() : (v == null ? "" : String(v).trim());
  try {
    if(prize) sessionStorage.setItem(PRIZE_KEY, prize);
    else sessionStorage.removeItem(PRIZE_KEY);
  } catch {}                      // private browsing: the run still works
  return prize;
}

function loadPrize(){
  if(prize) return prize;
  try { prize = sessionStorage.getItem(PRIZE_KEY) || ""; } catch {}
  return prize;
}

/* ------------------------------------------------------ prize presentation */

/* The endpoint hands the prize back as one free-text line — "Early Bird 2 juta +
   BNSP + Exclusive Starter Kit" — and that is deliberate: Code.gs owns the table,
   so the page keeps working when a row is reworded or a fourth one is added. The
   reveal wants it in pieces though (a figure big enough to be the payoff, the
   tier it belongs to, the perks as their own chips), so the line is taken apart
   here rather than restructured server-side.

   Every branch degrades to printing the line verbatim. A prize the parser has
   never seen still reads correctly on the ticket — it just misses the big-figure
   treatment, which is the right way round for something the sheet can change
   without anyone touching this file. */

/* One "+"-separated clause: the money in it, and the words left over — which are
   what names the tier ("Early Bird 2 juta" -> 2000000 + "Early Bird"). The \b
   after the unit is load-bearing: without it the K in "Exclusive Starter Kit"
   reads as thousands. */
function money(clause){
  const take = (m, mul) => ({
    rp: Math.round(parseFloat(m[1].replace(",", ".")) * mul),
    rest: clause.replace(m[0], " "),
  });
  let m;
  if((m = clause.match(/(\d+(?:[.,]\d+)?)\s*(?:juta|jt)\b/i)))  return take(m, 1e6);
  if((m = clause.match(/(\d+(?:[.,]\d+)?)\s*(?:ribu|rb|k)\b/i))) return take(m, 1e3);
  // already written out — the dots are thousand separators, not a decimal point
  if((m = clause.match(/rp\.?\s*(\d[\d.]{3,})/i)))
    return { rp: parseInt(m[1].replace(/\./g, ""), 10), rest: clause.replace(m[0], " ") };
  return null;
}

function parsePrize(text){
  const raw = String(text == null ? "" : text).trim();
  const perks = [], parts = [];
  let rp = 0, tier = "";
  for(const clause of raw.split("+").map(s => s.trim()).filter(Boolean)){
    const m = money(clause);
    if(!m){ perks.push(clause); continue; }
    const label = m.rest.replace(/\s+/g, " ").trim();
    rp += m.rp;
    if(label && !tier) tier = label;
    parts.push({ label, rp: m.rp });
  }
  return { raw, rp, tier, perks, parts };
}

const groups = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const rupiah = n => "Rp" + groups(n);
/* the prize line is remote text landing in innerHTML, so it is escaped on the way */
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* Stroke icons on a tinted tile, the same language as the HUD's gift chip. Order
   matters: "Exclusive AI Class Library" answers to the kit pattern too, so the
   more specific rows come first. Anything unrecognised gets a star, which is why
   a new perk in the sheet needs no code change to look deliberate. */
const PERK_ART = [
  [/bnsp|sertifik|certif/i, "biru", '<path d="M12 2.6 4.7 5.4v5.9c0 4.5 3 8.3 7.3 9.8 4.3-1.5 7.3-5.3 7.3-9.8V5.4z"/><circle cx="12" cy="10" r="2.1"/><path d="M8.7 16.3a3.5 3.5 0 0 1 6.6 0"/>'],
  [/librar|kelas|class|kurikul|modul/i, "biru", '<path d="M4 4.6h5.1A2.9 2.9 0 0 1 12 7.5v11a3.4 3.4 0 0 0-2.9-1.6H4z"/><path d="M20 4.6h-5.1A2.9 2.9 0 0 0 12 7.5v11a3.4 3.4 0 0 1 2.9-1.6H20z"/>'],
  [/kit|merch|starter|gift|bonus/i, "kuning", '<path d="M20 12v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8"/><rect x="2.4" y="7" width="19.2" height="5" rx="1"/><path d="M12 7v14M12 7S9.6 7 8.2 5.6 8.7 2.2 10.1 2.8 12 7 12 7zM12 7s2.4 0 3.8-1.4S15.3 2.2 13.9 2.8 12 7 12 7z"/>'],
];
const PERK_STAR = '<path d="M12 3.3l2.6 5.6 6.2.6-4.7 4.1 1.4 6.1L12 16.5l-5.5 3.2 1.4-6.1L3.2 9.5l6.2-.6z"/>';

function perkChip(label){
  const [, tint, art] = PERK_ART.find(a => a[0].test(label)) || [0, "kuning", PERK_STAR];
  return `<span class="perk ${tint}">` +
         `<i><svg viewBox="0 0 24 24" aria-hidden="true">${art}</svg></i>${esc(label)}</span>`;
}

function fillPrize(){
  /* Everyone who finishes keeps the prize their email drew — placing does not
     gate it, and neither does anything else: the ticket is never collapsed. It
     used to be hidden whenever `prize` was falsy, which turned any hiccup in the
     response into a results card with no payoff on it at all. */
  const p = parsePrize(loadPrize() || (LEAD_ENDPOINT ? PRIZE_FALLBACK : setPrize(devDraw())));
  const amt = $("prize-amount"), tier = $("prize-tier");

  if(p.rp > 0){
    amt.className = "";
    amt.innerHTML = `<span class="rp">Rp</span><span class="n">${groups(p.rp)}</span>`;
    tier.textContent = p.tier ? p.tier + " Prize" : "Hadiah Merdeka";
    tier.style.display = "";
    // two figures summed into one headline (SWE) get their split spelled out
    $("prize-break").textContent = p.parts.length > 1
      ? p.parts.map(x => (x.label || "Bonus") + " " + rupiah(x.rp)).join("  +  ")
      : "";
    $("perks").innerHTML = p.perks.map(perkChip).join('<span class="plus">+</span>');
  } else {
    /* No figure anywhere in the line, so there is nothing to headline and nothing
       to call a perk either — every clause is already in the prose. Chipping them
       as well is how PRIZE_FALLBACK ended up printed twice on the same card. */
    amt.className = "text";
    amt.textContent = p.raw || PRIZE_FALLBACK;
    tier.style.display = "none";
    $("prize-break").textContent = "";
    $("perks").innerHTML = "";
  }
}

const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;

function devDraw(){
  const table = DEV_PRIZES[VARIANT];
  const total = table.reduce((n, p) => n + p[1], 0);
  let roll = Math.random() * total;
  for(const [label, w] of table){ roll -= w; if(roll < 0) return label; }
  return table[table.length - 1][0];
}

/* Apps Script answers a plain POST but not a preflighted one, so this sends the
   body as text/plain — a "simple" request the browser issues without an OPTIONS
   round trip. The email therefore never appears in a URL or a server log line. */
async function claimPrize(email){
  if(!LEAD_ENDPOINT) return { ok: true, prize: devDraw(), returning: false, dev: true };
  const res = await fetch(LEAD_ENDPOINT, {
    method: "POST",
    body: JSON.stringify({ email, variant: VARIANT, source: location.pathname }),
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
let W = 1280, H = 720, SS = 720, dpr = 1;   // SS = scene scale, keeps portrait sane
let GY = 600, PITCH = 65;         // ground line and lane spacing, world px

/* The race is a horizontal chase, so a tall viewport spends its height on sky
   while hiding the track the drama actually lives on. Anything narrower than
   BAND_ASPECT gets the race banded, and the strips left over become the HUD
   and the thumb zone — a slim bar above, a control panel below, exactly the
   proportions the ad creative frames its scenes with. */
const BAND_ASPECT = 1.5;
const TOPBAR  = 92;               // design px of HUD above the band
const THUMB   = .27;              // share of the viewport the tap panel takes
const CAM_HOLD = .50;             // where the camera parks the player across the frame
let SW = 0, SH = 0;               // viewport, CSS px
let bandTop = 0, bandH = 0;       // the race band on screen, CSS px (always full width)
let letterboxed = false;
let HS = 1;                       // HUD scale — CSS px per design px
let safeT = 0, safeB = 0;         // notch / home-indicator insets, CSS px
let muteReserve = 72;             // width the DOM mute button claims on the right

// env() does not resolve through getComputedStyle on a custom property, so read
// it off an element that actually applies it
const safeEl = document.getElementById("safe");
function readInsets(){
  const cs = getComputedStyle(safeEl);
  safeT = parseFloat(cs.paddingTop) || 0;
  safeB = parseFloat(cs.paddingBottom) || 0;
}

function resize(){
  const r = cv.getBoundingClientRect();
  if(!r.width || !r.height) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const px = Math.round(r.width * dpr), py = Math.round(r.height * dpr);
  if(px === cv.width && py === cv.height) return;   // nothing changed
  cv.width = px; cv.height = py;
  SW = r.width; SH = r.height;
  readInsets();

  letterboxed = SH > SW / BAND_ASPECT + 1;
  HS = letterboxed ? clamp(SW / 520, .6, 1.1) : 1;
  if(letterboxed){
    // the strips are budgeted, not left over: the HUD gets exactly its bar and
    // the thumb panel its share, and the scene keeps everything in between
    bandTop = Math.min(SH * .18, TOPBAR * HS + safeT);
    // the tap panel is capped rather than handed the leftovers: it only needs
    // room for the button and its caption, and every pixel past that is scene
    const thumb = clamp(SH * THUMB, 150 * HS, 260) + safeB;
    bandH = clamp(SH - bandTop - thumb, SH * .34, SW / .70);
  } else {
    bandTop = 0; bandH = SH;
  }

  // ~1280x720 of world space across the band; wider bands zoom out no further,
  // narrower ones zoom in rather than letting the view grow endlessly tall
  W = clamp(Math.round(720 * SW / bandH), 560, 1280);
  H = Math.round(W * bandH / SW);
  // On a tall band the limit is the width, not the height. Holding the scene to
  // .65 of it left the racers at ~13% of the frame where the reference art puts
  // them at ~22%, so the whole scene read as distant.
  SS = Math.min(H, W * .92);
  // A tall band would otherwise be two thirds sky: stretch the lane stack until
  // the horizon sits about 42% down the frame, the way the reference art does.
  GY = Math.min(H - SS * .06, H * .84);
  PITCH = clamp((GY - H * .42 - SS * .085) / 3, SS * .09, SS * .14);
  // full-screen, the chrome is sized against the band it floats on; banded, it
  // is sized against the viewport, or it would be postage-stamp small
  if(!letterboxed) HS = (SS / 720) * (SW / W);
  // the HUD row has to stop clear of the mute button, which is DOM and sizes
  // itself off the viewport — measure it here rather than guessing per frame.
  // It is display:none on the title screen, so keep the last real reading rather
  // than falling back to a guess the drawn HUD would then tuck underneath.
  const mr = document.getElementById("mute").getBoundingClientRect();
  if(mr.width) muteReserve = (SW - mr.left) + 10;

  bandSpace();
}
window.addEventListener("resize", resize);

// world space maps onto the band; screen space is plain CSS pixels
function bandSpace(){ const s = (SW * dpr) / W; ctx.setTransform(s, 0, 0, s, 0, bandTop * dpr); }
function screenSpace(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

const $ = id => document.getElementById(id);
const show = id => {
  ["scr-title","scr-email","scr-select","scr-race","scr-done"].forEach(s => $(s).classList.toggle("on", s === id));
  $("tapzone").classList.toggle("on", id === "scr-race");
  // the logo shares the top-left corner with the race HUD, so it steps aside
  $("stage").classList.toggle("racing", id === "scr-race");
  // the title screen puts sound inside Pengaturan instead of the floating disc
  $("stage").classList.toggle("titling", id === "scr-title");
  mixFor(id);
  closeModal();
};

/* -------------------------------------------------------------------- audio */

/* Sampled cues from audio/, with the old synth underneath as the fallback. That
   fallback is not politeness: the README promises index.html opens straight off
   the filesystem, and a file:// fetch of audio/ is blocked, so the synth is what
   plays when you double-click the file rather than serve it. Design in SOUND.md. */

let actx = null, muted = false, bus = null;
const ac = () => actx || (actx = new (window.AudioContext || window.webkitAudioContext)());

function beep(freq, dur, type="square", vol=.06, slide=0){
  if(muted) return;
  const c = ac(), t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + .02);
}

const MUSIC = ["bed", "crowd", "pulse", "hook"];
/* D major pentatonic, one rung per combo step. The ladder is a single recorded
   cue played at twelve rates, so twelve pitches cost no extra bytes. */
const LADDER = [587.33, 659.26, 739.99, 880, 987.77, 1174.66,
                1318.51, 1479.98, 1760, 1975.53, 2349.32, 2637.02];

let sheet = null, sfxMap = null, loopLen = null, payoffBuf = null;
let musicT0 = 0, hookOn = false, audioReady = false, audioAsked = false;
let wantMix = "scr-title";
const stems = {};

/* Called at the email step: there is a natural pause there while the player
   types, it is the first moment they have shown they intend to play, and it keeps
   every byte of this off the critical path. */
function loadAudio(){
  if(audioAsked) return;
  audioAsked = true;
  const c = ac();
  const dec = u => fetch(u)
    .then(r => { if(!r.ok) throw new Error(u + " -> " + r.status); return r.arrayBuffer(); })
    .then(b => c.decodeAudioData(b));
  Promise.all([
    fetch("audio/sfx.json").then(r => r.json()),
    dec("audio/sfx.m4a"),
    dec("audio/payoff.m4a"),
    Promise.all(MUSIC.map(id => dec("audio/" + id + ".m4a"))),
  ]).then(([map, sh, pay, bufs]) => {
    sfxMap = map.cues; loopLen = map.loops; sheet = sh; payoffBuf = pay;
    MUSIC.forEach((id, i) => { stems[id] = { buf: bufs[i] }; });
    bus = c.createGain();
    bus.gain.value = muted ? 0 : 1;
    bus.connect(c.destination);
    audioReady = true;
    mixFor(wantMix);              // the player may already have moved on
  }).catch(err => {
    // a slow or missing audio/ must never cost anyone the race
    console.warn("audio/ unavailable, using synth cues:", err.message);
  });
}

/* one slice of the sprite sheet; offsets come straight from audio/sfx.json */
function cue(name, rate = 1, gain = 1){
  if(muted || !audioReady) return false;
  const s = sfxMap[name];
  if(!s) return false;
  const src = actx.createBufferSource();
  src.buffer = sheet;
  src.playbackRate.value = rate;
  const g = actx.createGain();
  g.gain.value = gain;
  src.connect(g).connect(bus);
  src.start(actx.currentTime, s.at, s.dur / rate);
  return true;
}

/* Every stem starts once at a shared t0 and is never stopped -- only its gain
   moves. Restarting a source to "turn a layer on" is what makes layers drift out
   of phase, and the pulse is the tap grid, so it cannot be allowed to slip. */
function musicUp(){
  if(!audioReady || musicT0) return;
  musicT0 = actx.currentTime + .06;
  for(const id of MUSIC){
    const st = stems[id];
    const src = actx.createBufferSource();
    src.buffer = st.buf;
    src.loop = true;
    src.loopStart = 0;
    /* NOT st.buf.duration. AAC pads to whole 1024-sample frames and Chrome does
       not trim the trailing padding, so a stem decodes 7-14 ms longer than it
       was rendered; looping on that drifts the tap grid ~85 ms over a race.
       audio/sfx.json carries the musical length, which is exact. */
    src.loopEnd = loopLen[id] || st.buf.duration;
    st.gain = actx.createGain();
    st.gain.gain.value = 0;
    src.connect(st.gain).connect(bus);
    src.start(musicT0);
  }
}

function ride(id, on, tau){
  const st = stems[id];
  if(!st || !st.gain) return;
  st.gain.gain.cancelScheduledValues(actx.currentTime);
  st.gain.gain.setTargetAtTime(on ? 1 : 0, actx.currentTime, tau);
}

/* One musical idea; a screen change adds or drops a layer rather than cutting.
   The menus are music only — the crowd arrives with the race, so the kampung
   turning up is itself the cue that the race is about to start. */
const SCREEN_MIX = {
  "scr-title":  ["bed"],
  "scr-email":  ["bed"],
  "scr-select": ["bed"],
  "scr-race":   ["pulse", "crowd"],
  "scr-done":   [],
};

function mixFor(id){
  wantMix = id;
  if(!audioReady) return;
  musicUp();
  const want = SCREEN_MIX[id] || [];
  for(const s of MUSIC) if(s !== "hook") ride(s, want.indexOf(s) >= 0, .28);
  if(id !== "scr-race") setHook(false);
}

/* Layer C is the reward: the arrangement thickens once the player is holding a
   rhythm, which lands faster than any number on the HUD. */
function setHook(on){
  if(!audioReady || hookOn === on) return;
  hookOn = on;
  ride("hook", on, on ? .10 : .45);
}

const sfxHop     = () => cue("hop") || beep(300, .10, "square", .05, 260);
const sfxPerfect = combo => cue("perfect", LADDER[clamp(combo, 1, COMBO_MAX) - 1] / LADDER[0])
  || (beep(660, .09, "square", .05), setTimeout(() => beep(990, .10, "square", .045), 60));
const sfxLand    = () => cue("land", 1, .8) || beep(120, .07, "triangle", .05, -60);
/* the trip and the dud tap were silent until now -- see SOUND.md; the trip is the
   race's only punishment, so it is mixed to cut through the pulse */
const sfxTrip    = () => cue("trip") || beep(210, .24, "sawtooth", .06, -120);
const sfxDud     = () => cue("dud", 1, .9) || beep(150, .04, "square", .02);
const sfxLead    = () => cue("lead");
const sfxTape    = () => cue("tape");
const sfxPrize   = () => cue("prize");
const sfxTick    = () => cue("tick") || beep(440, .12, "square", .05);
const sfxRoll    = () => cue("roll");
const sfxWhistle = () => cue("whistle")
  || (beep(880, .12, "square", .06), setTimeout(() => beep(1320, .18, "square", .06), 130));
const sfxLose    = () => cue("lose")
  || [440,392,330].forEach((f,i) => setTimeout(() => beep(f, .26, "triangle", .06), i*160));
const sfxSelect  = () => cue("ui-select")  || beep(700, .07, "square", .05);
const sfxConfirm = () => cue("ui-confirm") || beep(660, .10, "square", .06);
const sfxOpen    = () => cue("ui-open")    || beep(620, .07, "square", .05);

// the results card gets the full band rather than a sting, so it is its own buffer
function sfxWin(){
  if(!muted && audioReady && payoffBuf){
    const src = actx.createBufferSource();
    src.buffer = payoffBuf;
    src.connect(bus);
    src.start(actx.currentTime);
    return;
  }
  [523,659,784,1046].forEach((f,i) => setTimeout(() => beep(f, .22, "triangle", .07), i*130));
}

/* inline SVG rather than 🔊/🔇: an emoji is a colour glyph, so the button's own
   `color` never reaches it and every platform draws a different weight on the disc */
const ICON_ON  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19zM15.5 9.2a4 4 0 0 1 0 5.6M18.4 6.6a8 8 0 0 1 0 10.8"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19zM16 10l5 4M21 10l-5 4"/></svg>';

const MUTE_KEY = "ttm-suara";

function setMuted(v){
  muted = v;
  // a player who muted once and came back through a second ad impression should
  // stay muted; localStorage throws rather than no-ops in some privacy modes
  try { localStorage.setItem(MUTE_KEY, v ? "0" : "1"); } catch (e) { /* ignore */ }
  // the music runs through the bus, so muting has to reach it and not just the cues
  if(bus) bus.gain.setTargetAtTime(v ? 0 : 1, actx.currentTime, .04);
  const b = $("mute");
  b.innerHTML = muted ? ICON_OFF : ICON_ON;
  b.setAttribute("aria-pressed", String(muted));
  b.setAttribute("aria-label", muted ? "Nyalakan suara" : "Matikan suara");
  // the Pengaturan switch may be open on the other side of the same state
  const sw = document.querySelector('[data-toggle="sound"]');
  if(sw) sw.textContent = muted ? "Mati" : "Nyala";
}
$("mute").onclick = () => setMuted(!muted);
let startMuted = false;
try { startMuted = localStorage.getItem(MUTE_KEY) === "0"; } catch (e) { /* ignore */ }
setMuted(startMuted);

/* An AudioContext created before any gesture starts suspended, and one that was
   running can be suspended again when the tab is backgrounded mid-race. */
const wake = () => { if(actx && actx.state === "suspended") actx.resume(); };
document.addEventListener("pointerdown", wake, true);
document.addEventListener("keydown", wake, true);

/* ----------------------------------------------------- hadiah / pengaturan */

const MODALS = {
  hadiah: () => ["Hadiah Merdeka", `
    <p class="lead">Diskon program sampai dengan <b>${DISKON_MAX}</b>.</p>
    <ol class="steps">
      <li>Masukkan emailmu — hadiahnya langsung dikunci atas namamu.</li>
      <li>Pilih pelompat, lalu tap secepat mungkin sampai garis finis.</li>
      <li>Hadiah muncul di akhir balapan. Semua yang finis kebagian.</li>

};

let lastFocus = null;
function openModal(kind){

  const [title, body] = build();

  $("modal-body").innerHTML = body;

}
