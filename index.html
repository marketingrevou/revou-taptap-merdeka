<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tap Tap Merdeka — Balap Karung</title>
<style>
  /* One 40 KB variable file covers every weight the design asks for (400-700),
     self-hosted so index.html still opens straight off the filesystem. */
  @font-face{
    font-family:"IBM Plex Sans";
    src:url("fonts/ibm-plex-sans-latin.woff2") format("woff2");
    font-weight:100 700;font-style:normal;font-display:swap;
  }

  :root{
    /* lifted from the Figma frame "DA Mystery Discount Box" (1749:2350) */
    --merah:#dd1f26;
    --merah-tua:#8f1419;
    --bg-dalam:#f35e64;
    --bg-tengah:#e83f45;
    --bg-luar:#dd1f26;
    --kuning-1:#fff3b6;
    --kuning-2:#ffde3b;
    --emas-bayang:#685020;      /* the badge's hard offset shadow */
    --ink:#311f17;
    --putih:#ffffff;
    /* badge border + shadow, overridden inside the ad lockup so the whole
       thing scales as one unit rather than each part clamping separately */
    --badge-b:6px;
    --badge-s:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg-luar);
            font-family:"IBM Plex Sans","Trebuchet MS",Verdana,system-ui,sans-serif;color:var(--ink)}
  #stage{position:fixed;inset:0;overflow:hidden;touch-action:manipulation}
  /* absolute, not a grid item: a percentage-sized canvas would otherwise be laid
     out from its own intrinsic ratio, and resizing would feed back into itself */
  canvas{position:absolute;inset:0;display:block;width:100%;height:100%}

  /* the ad's backdrop. It sits *behind* the canvas and is always on: it backs the
     menus (where render() skips the scene entirely) and it fills the letterbox
     strips above and below the race band on tall screens. */
  #backdrop{position:absolute;inset:0;
            background:url("assets/bg-festival.jpg") center bottom/cover no-repeat,
                       radial-gradient(ellipse 88.5% 96.9% at 50% 50%,
                         var(--bg-dalam) 0%,var(--bg-tengah) 50%,var(--bg-luar) 100%)}
  /* measured in JS: env() will not resolve through getComputedStyle on a custom
     property, but it does resolve on a real declaration */
  #safe{position:absolute;top:0;left:0;width:0;height:0;pointer-events:none;visibility:hidden;
        padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

  .layer{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
         padding:clamp(12px,3vmin,32px);text-align:center;gap:clamp(10px,2.2vmin,22px)}
  .layer.on{display:flex}
  .layer.pass{pointer-events:none}
  .layer.pass > *{pointer-events:auto}

  .scrim{background:radial-gradient(120% 90% at 50% 40%,rgba(120,16,20,.42),rgba(48,10,12,.84))}

  /* the gold card: white keyline, 7px corner, hard shadow — Figma node 1749:2900 */
  .badge{background:linear-gradient(180deg,var(--kuning-1) 0%,var(--kuning-2) 100%);
         border:var(--badge-b) solid var(--putih);border-radius:7px;
         filter:drop-shadow(0 var(--badge-s) 0 var(--emas-bayang))}

  /* stands in for the wordmark's outline-and-shadow treatment on plain headings.
     Built from stacked shadows rather than -webkit-text-stroke: the stroke is
     centred on the glyph edge, so at this weight it swallows the red fill. */
  .display{font-weight:700;text-transform:uppercase;line-height:1.05;letter-spacing:.01em;
           color:var(--merah);
           text-shadow:-.055em -.055em 0 var(--putih), .055em -.055em 0 var(--putih),
                       -.055em  .055em 0 var(--putih), .055em  .055em 0 var(--putih),
                       -.078em 0 0 var(--putih), .078em 0 0 var(--putih),
                       0 -.078em 0 var(--putih), 0 .078em 0 var(--putih),
                       0 .17em 0 rgba(70,18,20,.32)}

  h2{font-size:clamp(20px,4.4vmin,44px)}
  p.hint{color:#5e3626;font-size:clamp(12px,2.1vmin,17px);font-weight:600;
         text-shadow:0 0 7px rgba(255,255,255,.9),0 0 3px rgba(255,255,255,.95)}
  .scrim p.hint{color:#f6e3d4;text-shadow:0 1px 2px rgba(0,0,0,.5)}

  /* ---- ad lockup: the title screen, rebuilt from the Figma frame ---------- */
  /* --w is the wordmark width; every other size in the lockup is a ratio of it,
     exactly as the 744px-wide lockup relates to the rest of the 1920x900 frame */
  #scr-title{padding:0;gap:0;overflow:hidden}
  /* the wordmark is the widest thing in the lockup; the badge under it runs about
     .9x --w, since "Rp5,000,000!" sets its own width rather than the artwork's */
  .ad{--w:min(46vw,88vh,744px);
      --badge-b:max(5px,calc(var(--w) * .0134));
      --badge-s:max(5px,calc(var(--w) * .0121));
      display:flex;align-items:center;justify-content:center;gap:calc(var(--w) * .06);
      width:100%;height:100%;padding:0 clamp(10px,2.5vw,56px)}
  .ad-copy{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:calc(var(--w) * .035)}
  /* 637 wide against the 744 lockup, and hanging 120px past the frame's
     bottom edge — that overhang is what keeps it from being clipped at the top */
  .ad-hero{flex:0 0 auto;width:calc(var(--w) * .856);align-self:flex-end;
           margin-bottom:calc(var(--w) * -.16);
           transform:rotate(2.65deg);transform-origin:50% 100%;
           filter:drop-shadow(0 .04em .5em rgba(90,10,14,.35))}

  /* two SVGs, overlapped at the ratios they sit at inside the 744x382 lockup */
  .wordmark{position:relative;width:var(--w);aspect-ratio:744.151/381.83}
  .wordmark img{position:absolute;display:block}
  .wm-taptap{left:7.13%;top:0;width:81.41%}
  .wm-merdeka{left:0;top:43.66%;width:100%}

  .promo-card{display:flex;flex-direction:column;align-items:center;
              gap:calc(var(--w) * .0121);padding:calc(var(--w) * .0403) calc(var(--w) * .0417)}
  .promo-title{display:block;width:calc(var(--w) * .667)}
  .promo-line{display:flex;align-items:center;justify-content:center;gap:calc(var(--w) * .0148);
              color:var(--ink);font-weight:700;line-height:1.1;white-space:nowrap}
  .promo-line span{font-size:calc(var(--w) * .035)}
  .promo-line b{font-size:calc(var(--w) * .078)}

  .cta{display:flex;flex-direction:column;align-items:center;gap:calc(var(--w) * .022);
       margin-top:calc(var(--w) * .012)}
  /* the CTA is not in the frame, so it is sized off --w to carry the same
     weight as the badge above it rather than clamping on its own */
  .cta .btn{font-size:calc(var(--w) * .042);padding:calc(var(--w) * .026) calc(var(--w) * .062)}
  .cta .hint{font-size:calc(var(--w) * .028)}

  /* portrait and small landscape: one centred column, hero art dropped so the
     copy is never squeezed against it */
  @media (max-width:900px),(max-height:520px){
    .ad{--w:min(88vw,62vh);gap:0}
    .ad-hero{display:none}
  }

  /* ---------------------------------------------------------------- buttons */
  .btn{border:var(--badge-b) solid var(--putih);cursor:pointer;font:inherit;font-weight:700;
       letter-spacing:.05em;text-transform:uppercase;border-radius:7px;
       padding:clamp(9px,1.8vmin,15px) clamp(20px,4vmin,36px);
       background:linear-gradient(180deg,var(--kuning-1) 0%,var(--kuning-2) 100%);
       color:var(--ink);font-size:clamp(14px,2.4vmin,22px);
       box-shadow:0 var(--badge-s) 0 var(--emas-bayang);
       transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(var(--badge-s));box-shadow:0 0 0 var(--emas-bayang)}
  .btn.merah{background:var(--merah);color:var(--putih);box-shadow:0 var(--badge-s) 0 var(--merah-tua)}
  .btn.merah:active{box-shadow:0 0 0 var(--merah-tua)}
  .btn.ghost{background:var(--putih);color:var(--merah);box-shadow:0 var(--badge-s) 0 #b99a6a}
  .btn.ghost:active{box-shadow:0 0 0 #b99a6a}
  .row{display:flex;gap:clamp(8px,1.8vmin,16px);flex-wrap:wrap;justify-content:center}

  /* ---------------------------------------------------- email / lead capture */
  .email-card{width:min(92vw,520px);padding:clamp(18px,3.4vmin,32px);border-radius:10px;
              display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vmin,14px)}
  /* not .display: the white outline is there to lift text off the busy photo
     backdrop, and on the gold card it just muddies the letterforms */
  .email-card h2{font-size:clamp(20px,4vmin,36px);color:var(--merah);text-transform:uppercase;
                 line-height:1.05;text-shadow:0 .06em 0 rgba(104,80,32,.25)}
  .email-sub{color:var(--ink);font-weight:600;font-size:clamp(12px,2.1vmin,17px);text-align:center}
  #email-form{display:flex;flex-direction:column;gap:clamp(8px,1.6vmin,14px);width:100%;align-items:stretch}
  #email-input{font:inherit;font-weight:600;font-size:clamp(15px,2.4vmin,20px);color:var(--ink);
               padding:clamp(10px,1.9vmin,16px) clamp(12px,2.2vmin,18px);
               border:3px solid var(--putih);border-radius:7px;background:rgba(255,255,255,.92);
               box-shadow:inset 0 2px 0 rgba(104,80,32,.18);width:100%;text-align:center}
  #email-input::placeholder{color:#a08a63;font-weight:600}
  #email-input:focus{outline:0;border-color:var(--merah);background:#fff}
  #email-input.bad{border-color:var(--merah);background:#fff2f2}
  #btn-email[disabled]{opacity:.6;cursor:progress}
  .email-note{min-height:1.4em;font-weight:600;text-align:center;
              font-size:clamp(11px,1.9vmin,15px);color:#7a5a2c}
  .email-note.bad{color:var(--merah-tua)}

  /* the payoff line on the results card */
  #prize{margin-top:.7em;padding-top:.7em;border-top:3px dashed rgba(104,80,32,.35);text-align:center}
  #prize span{display:block;color:#7a5a2c;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
              font-size:clamp(9px,1.5vmin,12px)}
  #prize b{display:block;margin-top:.25em;color:var(--merah);line-height:1.15;
           font-size:clamp(15px,2.6vmin,23px)}

  /* ---- picker: a slider, one racer at a time, neighbours peeking in ------ */
  /* the hero portraits are bust-length and much taller than they are wide, so
     the frame is roomier than it was for the full-body vector sprites */
  #carousel{position:relative;width:min(94vw,720px);height:clamp(190px,44vmin,390px);
            touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
  #carousel.grabbing{cursor:grabbing}
  /* pool of light the chosen racer stands in */
  #plinth{position:absolute;left:50%;bottom:-3%;width:clamp(150px,30vmin,270px);height:clamp(28px,5.6vmin,52px);
          transform:translateX(-50%);border-radius:50%;pointer-events:none;
          background:radial-gradient(closest-side,rgba(255,222,59,.62),rgba(255,222,59,.16) 62%,rgba(255,222,59,0))}
  #track{position:absolute;inset:0}
  .slide{position:absolute;left:50%;bottom:0;top:0;width:clamp(130px,27vmin,250px);
         transform-origin:50% 100%;display:flex;align-items:flex-end;justify-content:center;
         will-change:transform,opacity;
         transition:transform .34s cubic-bezier(.22,.9,.26,1),opacity .34s,filter .34s}
  #track.dragging .slide{transition:none}
  .slide img{width:100%;height:100%;object-fit:contain;object-position:bottom;pointer-events:none;
             filter:drop-shadow(0 .45em .5em rgba(0,0,0,.45))}
  .slide.on img{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}

  .arrow{position:absolute;top:50%;z-index:200;border:3px solid var(--putih);cursor:pointer;font:inherit;font-weight:700;
         width:clamp(34px,5.6vmin,50px);height:clamp(34px,5.6vmin,50px);border-radius:999px;
         background:var(--putih);color:var(--merah);font-size:clamp(20px,3.4vmin,30px);line-height:1;
         box-shadow:0 .16em 0 rgba(104,80,32,.55);transform:translateY(-50%);transition:opacity .2s}
  .arrow:active{transform:translateY(-46%) scale(.93)}
  .arrow.dim{opacity:.28;pointer-events:none}
  #prev{left:0} #next{right:0}

  #nameplate{padding:calc(var(--badge-b) * .8) 1.5em;text-align:center}
  #nameplate b{display:block;color:var(--ink);font-size:clamp(19px,3.6vmin,32px);letter-spacing:.03em;
               text-transform:uppercase}
  #nameplate i{display:block;font-style:normal;color:var(--merah);margin-top:.15em;font-weight:600;
               font-size:clamp(10px,1.8vmin,15px);letter-spacing:.14em;text-transform:uppercase}
  #nameplate.pop{animation:pop .3s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(7px) scale(.96)}to{opacity:1;transform:none}}

  #dots{display:flex;gap:8px}
  #dots button{border:0;padding:0;cursor:pointer;width:9px;height:9px;border-radius:999px;
               background:rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(104,80,32,.4);
               transition:width .22s,background .22s}
  #dots button.on{width:26px;background:var(--kuning-2)}

  #tapzone{position:absolute;inset:0;display:none}
  #tapzone.on{display:block}

  #results{padding:clamp(12px,2.6vmin,26px);min-width:min(88vw,460px);border-radius:10px}
  #results .rowline{display:flex;align-items:center;gap:.7em;padding:.4em .6em;border-radius:6px;
                    font-size:clamp(12px,2.1vmin,18px);font-weight:600}
  #results .rowline.me{background:var(--putih);font-weight:700;box-shadow:inset .3em 0 0 var(--merah)}
  #results .rowline span:nth-child(2){flex:1;text-align:left}
  #results .pos{width:1.9em;text-align:center;font-weight:700;color:var(--merah)}
  #results img{height:clamp(30px,5vmin,46px);object-fit:contain;object-position:bottom}
  .verdict{font-size:clamp(22px,5vmin,42px);margin-bottom:.35em}

  /* the frame places it at 116px on 1920 wide, 50/55 in from the corner */
  /* above the picker slides, which layoutPicker() stacks up to z-index 100 */
  #brandmark{position:absolute;top:clamp(10px,2.9vw,55px);left:clamp(10px,2.6vw,50px);z-index:400;
             width:clamp(38px,6vw,116px);height:auto;pointer-events:none;
             filter:drop-shadow(0 2px 5px rgba(90,10,14,.3))}
  #stage.racing #brandmark{display:none}
  /* red disc with a white keyline — the same pill language as the drawn HUD */
  #mute{position:absolute;top:clamp(8px,1.6vmin,16px);right:clamp(8px,1.6vmin,16px);z-index:400;cursor:pointer;
        background:#c9171e;color:var(--putih);border:3px solid var(--putih);border-radius:999px;
        width:clamp(34px,5vmin,46px);height:clamp(34px,5vmin,46px);
        font-size:clamp(15px,2.4vmin,21px);line-height:1;box-shadow:0 3px 0 rgba(112,10,14,.55)}
  #stage.racing #mute{box-shadow:0 3px 0 rgba(112,10,14,.75)}
  /* no "please rotate your phone" nag: portrait letterboxes the race instead */
  .fade{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="safe" aria-hidden="true"></div>
  <!-- behind the canvas: it backs the menus, and shows through the letterbox
       strips once the race is banded -->
  <div id="backdrop"></div>
  <canvas id="game"></canvas>

  <div class="layer on" id="scr-title">
    <div class="ad">
      <div class="ad-copy">
        <div class="wordmark">
          <img class="wm-taptap" src="assets/wordmark-taptap.svg" alt="">
          <img class="wm-merdeka" src="assets/wordmark-merdeka.svg" alt="Tap Tap Merdeka">
        </div>
        <div class="badge promo-card">
          <img class="promo-title" src="assets/diskon-program.svg" alt="Diskon Program">
          <p class="promo-line"><span>sampai dengan</span><b>Rp5,000,000!</b></p>
        </div>
        <div class="cta">
          <button class="btn merah" id="btn-play">Mulai</button>
          <p class="hint">Tap layar / tekan SPASI untuk melompat</p>
        </div>
      </div>
      <img class="ad-hero" src="sprites/adik_hero.png" alt="">
    </div>
  </div>

  <div class="layer" id="scr-email">
    <div class="badge email-card">
      <h2>Satu langkah lagi</h2>
      <p class="email-sub">Masukkan email untuk mengunci hadiahmu</p>
      <form id="email-form" novalidate>
        <input id="email-input" type="email" inputmode="email" autocomplete="email"
               spellcheck="false" placeholder="nama@email.com" aria-label="Alamat email" required>
        <button class="btn merah" id="btn-email" type="submit">Lanjut</button>
      </form>
      <p class="email-note" id="email-note" role="status"></p>
    </div>
  </div>

  <div class="layer" id="scr-select">
    <h2 class="display">Pilih Pelompatmu</h2>
    <div id="carousel">
      <div id="plinth"></div>
      <div id="track"></div>
      <button class="arrow" id="prev" aria-label="Sebelumnya">‹</button>
      <button class="arrow" id="next" aria-label="Berikutnya">›</button>
    </div>
    <div id="nameplate" class="badge"><b id="pick-name"></b><i id="pick-tag"></i></div>
    <div id="dots"></div>
    <button class="btn merah" id="btn-go">Ayo Balap!</button>
    <p class="hint">Geser untuk memilih — kamu melawan 3 peserta lainnya</p>
  </div>

  <div class="layer pass" id="scr-race"></div>
  <div id="tapzone"></div>

  <div class="layer scrim" id="scr-done">
    <div id="results" class="badge fade">
      <div class="verdict display" id="verdict"></div>
      <div id="board"></div>
      <div id="prize"><span>Hadiahmu</span><b id="prize-text"></b></div>
    </div>
    <div class="row">
      <button class="btn" id="btn-again">Main Lagi</button>
      <button class="btn ghost" id="btn-change">Ganti Karakter</button>
    </div>
  </div>

  <img id="brandmark" src="assets/revou-logo.png" alt="RevoU">
  <button id="mute" title="Suara">🔊</button>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ data -- */

const CHARS = [
  {id:"bapak", name:"Bapak",  tag:"Langkah mantap"},
  {id:"ibu",   name:"Ibu",    tag:"Gesit & lincah"},
  {id:"adik",  name:"Adik",   tag:"Kecil tapi cepat"},
  {id:"kakak", name:"Kakak",  tag:"Penuh semangat"},
];
const POSES = ["stand","ready","jump"];

const RACE_LEN   = 2400;   // world px from start line to finish line
const HOP_TIME   = 0.30;   // seconds airborne
const HOP_DIST   = 62;     // world px covered per hop
const PERFECT    = 0.18;   // tap this soon after landing for a combo
const BUFFER     = 0.10;   // a tap this close before landing still counts
const COMBO_MAX  = 12;
const RUNOUT     = 520;    // world px of track past the finish line
const START_X    = 170;   // racers line up here, so the start gate stays in frame
const CAM_MIN    = -170;

/* the same tokens the stylesheet uses, so the drawn HUD and the DOM chrome
   stay one design rather than two that drift apart */
const FONT      = '"IBM Plex Sans","Trebuchet MS",sans-serif';
const MERAH     = "#dd1f26";
const MERAH_TUA = "#8f1419";
const KUNING_1  = "#fff3b6";
const KUNING_2  = "#ffde3b";
const EMAS_BAYANG = "#685020";
const INK       = "#311f17";
const PUTIH     = "#ffffff";

const img = {};            // "bapak_stand" -> Image

/* ------------------------------------------------------------- boilerplate */

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a) * t;
const rnd   = (a,b) => a + Math.random() * (b-a);

/* ---------------------------------------------- campaign variant + lead capture */

/* Paste the Apps Script web app /exec URL here — see tools/apps-script/Code.gs.
   Left empty the game still plays, but it draws the prize locally: nothing is
   recorded and one-play-per-email is not enforced. Fine for development, never
   for a live campaign. */
const LEAD_ENDPOINT = "https://script.google.com/macros/s/AKfycbyFxWRm-h0KbJyovYh2DoTkdkIviHLfK0Lt__5QvCKA0NbTwcm3XCeqipFPAXH7lYGZQA/exec";

/* /swe serves the SWE prize table, everything else DA. The host rewrites /swe/*
   to this same file (see README > Variants), so the path is the only signal. */
const VARIANT = /(^|\/)swe(\/|$)/i.test(location.pathname) ? "swe" : "da";

/* Development mirror of the table in Code.gs, used only when LEAD_ENDPOINT is
   empty. Code.gs is the source of truth — the live page never sees the weights. */
const DEV_PRIZES = {
  da: [
    ["Early Bird 2 juta + BNSP + Exclusive Starter Kit", 30],
    ["Early Bird 2 juta + BNSP", 40],
    ["Early Bird 2 juta + BNSP + Exclusive AI Class Library", 30],
  ],
  swe: [
    ["Early Bird 3.5 juta + 1.5 juta", 10],
    ["Early Bird 3.5 juta + 1 juta", 70],
    ["Early Bird 3.5 juta + 500rb", 20],
  ],
};

let prize = "";        // decided once, at the email step, before the race starts

const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;

function devDraw(){
  const table = DEV_PRIZES[VARIANT];
  const total = table.reduce((n, p) => n + p[1], 0);
  let roll = Math.random() * total;
  for(const [label, w] of table){ roll -= w; if(roll < 0) return label; }
  return table[table.length - 1][0];
}

/* Apps Script answers a plain POST but not a preflighted one, so this sends the
   body as text/plain — a "simple" request the browser issues without an OPTIONS
   round trip. The email therefore never appears in a URL or a server log line. */
async function claimPrize(email){
  if(!LEAD_ENDPOINT) return { ok: true, prize: devDraw(), returning: false, dev: true };
  const res = await fetch(LEAD_ENDPOINT, {
    method: "POST",
    body: JSON.stringify({ email, variant: VARIANT, source: location.pathname }),
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
let W = 1280, H = 720, SS = 720, dpr = 1;   // SS = scene scale, keeps portrait sane
let GY = 600, PITCH = 65;         // ground line and lane spacing, world px

/* The race is a horizontal chase, so a tall viewport spends its height on sky
   while hiding the track the drama actually lives on. Anything narrower than
   BAND_ASPECT gets the race banded, and the strips left over become the HUD
   and the thumb zone — a slim bar above, a control panel below, exactly the
   proportions the ad creative frames its scenes with. */
const BAND_ASPECT = 1.5;
const TOPBAR  = 92;               // design px of HUD above the band
const THUMB   = .27;              // share of the viewport the tap panel takes
const CAM_HOLD = .50;             // where the camera parks the player across the frame
let SW = 0, SH = 0;               // viewport, CSS px
let bandTop = 0, bandH = 0;       // the race band on screen, CSS px (always full width)
let letterboxed = false;
let HS = 1;                       // HUD scale — CSS px per design px
let safeT = 0, safeB = 0;         // notch / home-indicator insets, CSS px
let muteReserve = 56;             // width the DOM mute button claims on the right

// env() does not resolve through getComputedStyle on a custom property, so read
// it off an element that actually applies it
const safeEl = document.getElementById("safe");
function readInsets(){
  const cs = getComputedStyle(safeEl);
  safeT = parseFloat(cs.paddingTop) || 0;
  safeB = parseFloat(cs.paddingBottom) || 0;
}

function resize(){
  const r = cv.getBoundingClientRect();
  if(!r.width || !r.height) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const px = Math.round(r.width * dpr), py = Math.round(r.height * dpr);
  if(px === cv.width && py === cv.height) return;   // nothing changed
  cv.width = px; cv.height = py;
  SW = r.width; SH = r.height;
  readInsets();

  letterboxed = SH > SW / BAND_ASPECT + 1;
  HS = letterboxed ? clamp(SW / 520, .6, 1.1) : 1;
  if(letterboxed){
    // the strips are budgeted, not left over: the HUD gets exactly its bar and
    // the thumb panel its share, and the scene keeps everything in between
    bandTop = Math.min(SH * .18, TOPBAR * HS + safeT);
    // the tap panel is capped rather than handed the leftovers: it only needs
    // room for the button and its caption, and every pixel past that is scene
    const thumb = clamp(SH * THUMB, 150 * HS, 260) + safeB;
    bandH = clamp(SH - bandTop - thumb, SH * .34, SW / .70);
  } else {
    bandTop = 0; bandH = SH;
  }

  // ~1280x720 of world space across the band; wider bands zoom out no further,
  // narrower ones zoom in rather than letting the view grow endlessly tall
  W = clamp(Math.round(720 * SW / bandH), 560, 1280);
  H = Math.round(W * bandH / SW);
  // On a tall band the limit is the width, not the height. Holding the scene to
  // .65 of it left the racers at ~13% of the frame where the reference art puts
  // them at ~22%, so the whole scene read as distant.
  SS = Math.min(H, W * .92);
  // A tall band would otherwise be two thirds sky: stretch the lane stack until
  // the horizon sits about 42% down the frame, the way the reference art does.
  GY = Math.min(H - SS * .06, H * .84);
  PITCH = clamp((GY - H * .42 - SS * .085) / 3, SS * .09, SS * .14);
  // full-screen, the chrome is sized against the band it floats on; banded, it
  // is sized against the viewport, or it would be postage-stamp small
  if(!letterboxed) HS = (SS / 720) * (SW / W);
  // the HUD row has to stop clear of the mute button, which is DOM and sizes
  // itself off the viewport — measure it here rather than guessing per frame
  const mr = document.getElementById("mute").getBoundingClientRect();
  muteReserve = mr.width ? (SW - mr.left) + 10 : 56;

  bandSpace();
}
window.addEventListener("resize", resize);

// world space maps onto the band; screen space is plain CSS pixels
function bandSpace(){ const s = (SW * dpr) / W; ctx.setTransform(s, 0, 0, s, 0, bandTop * dpr); }
function screenSpace(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

const $ = id => document.getElementById(id);
const show = id => {
  ["scr-title","scr-email","scr-select","scr-race","scr-done"].forEach(s => $(s).classList.toggle("on", s === id));
  $("tapzone").classList.toggle("on", id === "scr-race");
  // the logo shares the top-left corner with the race HUD, so it steps aside
  $("stage").classList.toggle("racing", id === "scr-race");
};

/* -------------------------------------------------------------------- audio */

let actx = null, muted = false;
function beep(freq, dur, type="square", vol=.06, slide=0){
  if(muted) return;
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + .02);
}
const sfxHop     = () => beep(300, .10, "square", .05, 260);
const sfxPerfect = () => { beep(660, .09, "square", .05); setTimeout(()=>beep(990,.10,"square",.045), 60); };
const sfxLand    = () => beep(120, .07, "triangle", .05, -60);
const sfxWhistle = () => { beep(880,.12,"square",.06); setTimeout(()=>beep(1320,.18,"square",.06),130); };
const sfxWin     = () => [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.22,"triangle",.07), i*130));
const sfxLose    = () => [440,392,330].forEach((f,i)=>setTimeout(()=>beep(f,.26,"triangle",.06), i*160));

$("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊"; };

/* --------------------------------------------------------------- the racers */

let state = "title";     // title | select | countdown | race | finish
let pick = 0;
let racers = [], camX = CAM_MIN, clock = 0, anim = 0, countdown = 0, finishAt = 0, flash = 0;
let banner = null;       // {text, life}
const puffs = [];

function makeRacers(){
  const order = [pick, ...CHARS.map((_,i)=>i).filter(i => i !== pick)];
  racers = order.map((ci, lane) => ({
    ci, lane,                      // lane 0 = nearest the camera = the player
    human: lane === 0,
    x: START_X, y: 0,
    air: false, hopT: 0, groundT: 9, combo: 0, hops: 0, lock: 0, wasted: 0,
    dist: HOP_DIST * rnd(.97, 1.03),
    skill: 0,                      // filled in below for the CPUs
    wait: 0, buffered: false,
    done: false, time: 0, place: 0,
  }));
  racers.forEach(r => {
    if(r.human) return;
    r.skill = rnd(.25, .90);                     // how tight their rhythm is
    r.wait  = lerp(.39, .152, r.skill);          // pause on the ground per hop
  });
  camX = CAM_MIN; clock = 0; finishAt = 0; puffs.length = 0; banner = null;
}

function hop(r){
  r.air = true; r.hopT = 0; r.hops++;
  const perfect = r.groundT <= PERFECT;
  r.combo = perfect ? Math.min(r.combo + 1, COMBO_MAX) : 0;
  r.step = r.dist * (1 + r.combo * .028);
  if(r.human){
    perfect && r.combo > 1 ? sfxPerfect() : sfxHop();
    if(perfect && r.combo > 0 && r.combo % 4 === 0) banner = {text:"MANTAP! x" + r.combo, life:1};
  }
}

function tap(){
  if(state !== "race") return;
  const r = racers[0];
  if(r.done) return;
  if(!r.air){
    if(r.lock <= 0) hop(r);
  } else if(HOP_TIME - r.hopT <= BUFFER){
    r.buffered = true;              // forgiving early tap, still counts as in-rhythm
  } else {
    r.combo = 0;                    // way too early: you trip over the sack
    r.wasted++;
  }
}

function land(r){
  r.air = false; r.hopT = 0; r.groundT = 0;
  if(r.wasted){ r.lock = .11 + Math.min(r.wasted, 2) * .045; r.buffered = false; r.wasted = 0; }
  if(r.human) sfxLand();
  for(let i=0; i<5; i++) puffs.push({
    x: r.x - 14 + rnd(-8,8), y: 0, lane: r.lane,
    vx: rnd(-26,-70), vy: rnd(-12,-52), life: rnd(.35,.6), age: 0, r: rnd(5,11),
  });
}

function step(dt){
  if(state === "countdown"){
    const was = Math.ceil(countdown);
    countdown -= dt;
    const now = Math.ceil(countdown);
    if(now !== was && now >= 0) now === 0 ? sfxWhistle() : beep(440, .12, "square", .05);
    if(countdown <= 0){ state = "race"; clock = 0; }
    racers.forEach(r => { r.groundT += dt; });
    return;
  }
  if(state !== "race" && state !== "finish") return;

  clock += dt;

  for(const r of racers){
    if(r.done){
      r.air = false; r.y = 0;
      r.x = Math.min(r.x + 130 * dt, RACE_LEN + RUNOUT - 80);
      continue;
    }

    if(r.air){
      r.hopT += dt;
      const k = clamp(r.hopT / HOP_TIME, 0, 1);
      r.x += (r.step / HOP_TIME) * dt;
      r.y = Math.sin(k * Math.PI) * 26;            // extra arc on top of the sprite lift
      if(r.hopT >= HOP_TIME){
        land(r);
        if(r.buffered && r.lock <= 0){ r.buffered = false; hop(r); }
      }
    } else {
      r.groundT += dt;
      r.lock = Math.max(0, r.lock - dt);
      r.y = 0;
      if(!r.human){
        // rubber band, tilted the player's way: the pack barely presses when
        // you lead, and eases off noticeably when you fall behind
        const gap = racers[0].x - r.x;
        const w = clamp(r.wait - gap * (gap > 0 ? .00066 : .00042), .15, .85);
        if(r.groundT >= w) hop(r);
      }
    }

    if(r.x >= RACE_LEN && !r.done){
      r.done = true; r.time = clock;
      r.place = racers.filter(o => o.done).length;
      if(r.human){
        finishAt = clock; flash = 1;
        state = "finish";
        banner = {text: r.place === 1 ? "JUARA!" : "FINIS!", life: 1.6};
      }
    }
  }

  // camera: parks the player mid-frame so the pack fans out behind him and
  // whoever is leading fills the right of the shot, then stops at the finish gate
  const target = clamp(racers[0].x - W * CAM_HOLD, CAM_MIN, RACE_LEN + RUNOUT - W);
  camX = lerp(camX, target, 1 - Math.pow(.0009, dt));

  for(let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i];
    p.age += dt;
    if(p.age >= p.life){ puffs.splice(i,1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt;
  }
  if(banner){ banner.life -= dt; if(banner.life <= 0) banner = null; }
  if(flash > 0) flash -= dt * 1.6;

  const allIn = racers.every(r => r.done);
  if(state === "finish" && (allIn || clock - finishAt > 3.6)) endRace();
}

/* ------------------------------------------------------------------ drawing */

const ground = () => GY;
function laneY(lane){ return GY - lane * PITCH; }
function laneScale(lane){ return 1 - lane * .07; }
/* Far lanes sit up AND to the left. The sideways step is the larger of the two,
   so the pack fans diagonally across the frame instead of stacking upward. */
function laneOff(lane){ return lane * PITCH * 1.05; }
const horizon = () => laneY(3) - SS * .085;

function drawSky(){
  const hz = horizon();
  const g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, "#4fb2e6"); g.addColorStop(.58, "#93d5f2"); g.addColorStop(1, "#d9eff5");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz + 2);

  // sun: a soft halo under a flat disc, the way the ad art lights its corners
  const sx = W * .84, sy = hz * .26, sr = SS * .058;
  const halo = ctx.createRadialGradient(sx, sy, sr * .7, sx, sy, sr * 2.7);
  halo.addColorStop(0, "rgba(255,232,130,.5)"); halo.addColorStop(1, "rgba(255,232,130,0)");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 2.7, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffe463";
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.beginPath(); ctx.arc(sx - sr * .26, sy - sr * .26, sr * .6, 0, 7); ctx.fill();

  // clouds: lobes over a flat base, so they read as cut-out shapes and not blobs.
  // Spacing is derived from the world width — a fixed pitch left a narrow band
  // with two clouds and a lot of bare blue.
  const span = W + 500, pitch = span / 9;
  for(let i = 0; i < 9; i++){
    const cx = ((i * pitch - camX * .18) % span + span) % span - 250;
    const cy = hz * (.14 + (i % 4) * .13), s = SS * (.030 + (i % 3) * .011);
    for(const [col, dy] of [["rgba(206,232,245,.9)", s * .1], ["#ffffff", 0]]){
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(cx, cy + dy, s, 0, 7);
      ctx.arc(cx + s * 1.02, cy + dy + s * .3, s * .7, 0, 7);
      ctx.arc(cx - s * .98, cy + dy + s * .34, s * .62, 0, 7);
      ctx.arc(cx + s * .46, cy + dy - s * .4, s * .56, 0, 7);
      ctx.fill();
      // one flat base tucked inside the lobes, so the silhouette sits level
      ctx.fillRect(cx - s * 1.55, cy + dy + s * .28, s * 3.1, s * .66);
    }
  }
}

/* Festival confetti drifting through the sky band — the one piece of motion the
   backdrop had none of, and the thing that ties the race to the title art. */
const KONFETI = [KUNING_2, PUTIH, MERAH, "#4aa3e0"];
function drawConfetti(){
  const s = SS / 720, hz = horizon(), span = W + 320, fall = hz * 1.05;
  ctx.save();
  ctx.globalAlpha = .9;
  for(let i = 0; i < 30; i++){
    const seed = i * 137.5;
    const drift = Math.sin(anim * .6 + i) * 26 * s;
    const x = ((seed * 7.3 - camX * .22 + drift) % span + span) % span - 160;
    const y = ((seed * 3.1 + anim * (14 + (i % 4) * 8)) % fall + fall) % fall;
    const w = (7 + (i % 3) * 3) * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(anim * (1.1 + (i % 3) * .45) + i);
    ctx.fillStyle = KONFETI[i % KONFETI.length];
    if(i % 3 === 0){                       // a few diamonds among the ribbons
      ctx.beginPath();
      ctx.moveTo(0, -w * .6); ctx.lineTo(w * .45, 0); ctx.lineTo(0, w * .6); ctx.lineTo(-w * .45, 0);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(-w / 2, -w * .3, w, w * .6);
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawHills(){
  const base = horizon() + 8;
  // far to near: lighter and taller behind, darker and flatter in front
  const bands = [
    ["#9ed0a4", 9, 340, 265, .195, .26],
    ["#7dbb8b", 8, 405, 315, .140, .38],
    ["#63a672", 7, 470, 360, .092, .50],
  ];
  for(const [col, n, sp, wid, ht, par] of bands){
    ctx.fillStyle = col;
    const cycle = n * sp;
    for(let i = 0; i < n; i++){
      const cx = ((i * sp - camX * par) % cycle + cycle) % cycle - 420;
      ctx.beginPath();
      ctx.moveTo(cx - wid, base);
      ctx.quadraticCurveTo(cx, base - SS * ht, cx + wid, base);
      ctx.fill();
    }
  }
}

function tree(x, y, s){
  ctx.fillStyle = "#7a5a3c";
  roundRect(x - 3.5 * s, y - 26 * s, 7 * s, 26 * s, 2 * s); ctx.fill();
  const blob = (dx, dy, r, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill();
  };
  blob(0, -42, 21, "#3d8b51"); blob(-17, -31, 15, "#3d8b51"); blob(17, -32, 16, "#3d8b51");
  blob(-3, -49, 14, "#55a866"); blob(14, -39, 11, "#55a866");
}

/* One onlooker: a rounded body in red or white, a head with black hair, and
   arms that go up when they cheer. Kept tiny — they read as a crowd, not faces. */
function person(x, y, s, i){
  const h = (17 + (i % 5) * 3) * s, w = 11 * s;
  const cheer = Math.sin(anim * 3.1 + i * 1.7) > .15;
  ctx.strokeStyle = "#f0c39a"; ctx.lineWidth = 2.6 * s; ctx.lineCap = "round";
  ctx.beginPath();
  if(cheer){
    ctx.moveTo(x + 1 * s, y - h * .78); ctx.lineTo(x - 4 * s, y - h - 5 * s);
    ctx.moveTo(x + w - 1 * s, y - h * .78); ctx.lineTo(x + w + 4 * s, y - h - 5 * s);
  } else {
    ctx.moveTo(x + 1 * s, y - h * .74); ctx.lineTo(x - 2 * s, y - h * .3);
    ctx.moveTo(x + w - 1 * s, y - h * .74); ctx.lineTo(x + w + 2 * s, y - h * .3);
  }
  ctx.stroke();
  ctx.fillStyle = i % 2 ? "#d8232a" : "#fdfaf5";
  roundRect(x, y - h, w, h, w * .4); ctx.fill();
  ctx.fillStyle = "#f0c39a";
  ctx.beginPath(); ctx.arc(x + w / 2, y - h - 5 * s, 5.2 * s, 0, 7); ctx.fill();
  ctx.fillStyle = "#2b2118";
  ctx.beginPath(); ctx.arc(x + w / 2, y - h - 6.2 * s, 5.2 * s, Math.PI, 0); ctx.fill();
}

function drawCrowd(){
  const y = horizon() + 14, s = SS / 720;
  for(let i = 0; i < 34; i++){
    const x = i * 150 + 60 - camX * .62;
    if(x < -90 || x > W + 90) continue;
    // trees every third slot: a narrow band shows only one or two at a time
    if(i % 3 === 0){ tree(x, y, s * (i % 2 ? 1.75 : 1.35)); continue; }
    for(let k = 0; k < 3; k++) person(x + k * 22 * s, y, s, i + k);
  }
}

function drawBunting(){
  // hung a fifth of the way down rather than pinned to the ceiling, so the
  // bunting sits in the sky instead of leaving a bare gap under it
  const s = SS / 720, span = 104 * s, top = Math.max(SS * .02, horizon() * .22);
  const off = -((camX * .8) % span), sag = 18 * s;

  ctx.save();
  ctx.lineCap = "round";
  // the rope reads as gold cord over its own soft shadow, not a pencil line
  for(const [col, dy, lw] of [["rgba(90,40,20,.18)", 3.5 * s, 5 * s], ["#e8b93f", 0, 3.4 * s]]){
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath();
    for(let x = -span; x < W + span; x += span){
      ctx.moveTo(x + off, top + dy);
      ctx.quadraticCurveTo(x + off + span / 2, top + sag + dy, x + off + span, top + dy);
    }
    ctx.stroke();
  }

  let i = Math.floor(camX * .8 / span);
  for(let x = -span; x < W + span; x += span, i++){
    const fx = x + off + span / 2, fy = top + sag * .78;
    const w = 19 * s, hgt = 46 * s;
    ctx.beginPath();
    ctx.moveTo(fx - w, fy); ctx.lineTo(fx + w, fy); ctx.lineTo(fx, fy + hgt);
    ctx.closePath();
    ctx.fillStyle = i % 2 ? MERAH : PUTIH;
    ctx.fill();
    ctx.strokeStyle = i % 2 ? "rgba(255,255,255,.85)" : "rgba(143,20,25,.35)";
    ctx.lineWidth = 2 * s; ctx.stroke();
    // a sliver of shade down one edge gives the flag a fold
    ctx.fillStyle = "rgba(0,0,0,.10)";
    ctx.beginPath();
    ctx.moveTo(fx + w * .18, fy); ctx.lineTo(fx + w, fy); ctx.lineTo(fx, fy + hgt);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* the little grass ticks scattered over the turf in the ad art */
function tuft(x, y, s){
  ctx.beginPath();
  ctx.moveTo(x - 4 * s, y); ctx.quadraticCurveTo(x - 3 * s, y - 6 * s, x - 1 * s, y - 7 * s);
  ctx.moveTo(x + 1 * s, y); ctx.quadraticCurveTo(x + 2 * s, y - 7 * s, x + 4 * s, y - 8 * s);
  ctx.stroke();
}

function drawField(){
  const top = horizon(), s = SS / 720;
  const g = ctx.createLinearGradient(0, top, 0, H);
  g.addColorStop(0, "#8ecb84"); g.addColorStop(.55, "#6fb469"); g.addColorStop(1, "#54a052");
  ctx.fillStyle = g; ctx.fillRect(0, top, W, H - top);

  // a band of shade right under the hill line, so the turf does not start flat
  const shade = ctx.createLinearGradient(0, top, 0, top + SS * .07);
  shade.addColorStop(0, "rgba(46,104,58,.30)"); shade.addColorStop(1, "rgba(46,104,58,0)");
  ctx.fillStyle = shade; ctx.fillRect(0, top, W, SS * .07);

  // lane strips, nearest lane last so it sits on top
  for(let lane = 3; lane >= 0; lane--){
    const y = laneY(lane), h = PITCH;
    ctx.fillStyle = lane % 2 ? "rgba(255,255,255,.07)" : "rgba(0,0,0,.045)";
    ctx.fillRect(0, y - h + 6, W, h);
    ctx.strokeStyle = "rgba(255,255,255,.62)"; ctx.lineWidth = 2.4 * s;
    ctx.beginPath(); ctx.moveTo(0, y + 6); ctx.lineTo(W, y + 6); ctx.stroke();
  }

  // turf detail: fixed to the world, so it scrolls with the track
  ctx.save();
  ctx.strokeStyle = "rgba(48,110,56,.42)"; ctx.lineWidth = 2 * s; ctx.lineCap = "round";
  for(let i = 0; i < 44; i++){
    const wx = i * 137 + (i % 5) * 23;
    const x = ((wx - camX) % 6028 + 6028) % 6028 - 300;
    if(x < -20 || x > W + 20) continue;
    const lane = i % 4;
    tuft(x, laneY(lane) - (i % 3) * 9 * s, s * (1 - lane * .07));
  }
  ctx.restore();

  // distance ticks every 100 world px
  ctx.font = `bold ${Math.round(SS*.021)}px ${FONT}`;
  ctx.textAlign = "center";
  for(let wx = START_X; wx <= RACE_LEN; wx += 100){
    const x = wx - camX;
    if(x < -60 || x > W + 60) continue;
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillRect(x - 2, laneY(3) - 4, 4, 12);
    const pct = Math.round((wx - START_X) / (RACE_LEN - START_X) * 100);
    if(pct % 25 === 0 && pct > 0 && pct < 100){
      ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.fillText(pct + "%", x, laneY(3) - 10);
    }
  }
}

/* Lines run across all four lanes, so they slant with the same offset the
   racers are drawn at: far lane up and to the left, near lane down-right. */
function laneSpan(worldX){
  return {
    fx: worldX - camX - laneOff(3), fy: laneY(3) - SS * .02,
    nx: worldX - camX + laneOff(0), ny: laneY(0) + SS * .022,
  };
}

function drawStartLine(){
  const p = laneSpan(START_X);
  if(p.nx < -60 || p.fx > W + 60) return;
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,.85)";
  ctx.lineWidth = 7 * (SS / 720); ctx.setLineDash([16, 12]);
  ctx.beginPath(); ctx.moveTo(p.fx, p.fy); ctx.lineTo(p.nx, p.ny); ctx.stroke();
  ctx.restore();
}

function drawFinish(){
  const p = laneSpan(RACE_LEN);
  if(p.nx < -320 || p.fx > W + 320) return;
  const s = SS / 720;

  // chequered ribbon on the grass: real squares laid along the slant, two rows
  // deep, rather than one dashed line pretending to be a chequerboard
  const dx = p.nx - p.fx, dy = p.ny - p.fy;
  const len = Math.hypot(dx, dy), cell = 9 * s, rows = 2;
  ctx.save();
  ctx.translate(p.fx, p.fy); ctx.rotate(Math.atan2(dy, dx));
  for(let r = 0; r < rows; r++){
    for(let c = 0; c * cell < len; c++){
      ctx.fillStyle = (r + c) % 2 ? INK : PUTIH;
      ctx.fillRect(c * cell, -cell * rows / 2 + r * cell, Math.min(cell, len - c * cell), cell);
    }
  }
  ctx.restore();

  /* Gantry, built in perspective. Each pole stands on its OWN end of the finish
     line — the far one on the far lane, shorter and thinner for the distance —
     and the board spans their two tops, so it slants and tapers with them
     instead of hanging as a flat rectangle across a slanted line. */
  const fs = laneScale(3), ns = laneScale(0);          // depth scale at each end
  const poleH = 250 * s;
  const fTop = p.fy - poleH * fs, nTop = p.ny - poleH * ns;

  const pole = (x, base, top, k) => {
    const w = 15 * s * k;
    ctx.fillStyle = "#7d5a3c";
    roundRect(x - w / 2, top, w, base - top, w * .3); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.18)";
    roundRect(x - w / 2, top, w * .36, base - top, w * .3); ctx.fill();
    ctx.fillStyle = KUNING_2;                          // gold cap, with a pennant
    ctx.beginPath(); ctx.arc(x, top - 3 * s * k, 6 * s * k, 0, 7); ctx.fill();
    ctx.fillStyle = MERAH;
    ctx.beginPath();
    ctx.moveTo(x, top - 9 * s * k);
    ctx.lineTo(x + 32 * s * k, top - 1 * s * k);
    ctx.lineTo(x, top + 7 * s * k);
    ctx.closePath(); ctx.fill();
  };
  pole(p.fx, p.fy, fTop, fs);                          // far first: the near one
  pole(p.nx, p.ny, nTop, ns);                          // reads as being in front

  // the board hangs a little below the caps, so the pennants stay clear of it
  const ax = p.fx, ay = fTop + 34 * s * fs;
  const bx = p.nx, by = nTop + 34 * s * ns;
  const blen = Math.hypot(bx - ax, by - ay);
  const over = 24 * s;                                 // overhang past each pole
  const x0 = -over, x1 = blen + over;
  const hf = 34 * s * fs, hn = 34 * s * ns;            // half-height at each end
  const h0 = lerp(hf, hn, x0 / blen), h1 = lerp(hf, hn, x1 / blen);

  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(Math.atan2(by - ay, bx - ax));
  // one trapezoid, offset for the shadow and inset for the keyline
  const slab = (d, dy) => {
    ctx.beginPath();
    ctx.moveTo(x0 + d, -h0 + d + dy); ctx.lineTo(x1 - d, -h1 + d + dy);
    ctx.lineTo(x1 - d, h1 - d + dy); ctx.lineTo(x0 + d, h0 - d + dy);
    ctx.closePath();
  };
  ctx.fillStyle = EMAS_BAYANG; slab(0, 7 * s); ctx.fill();
  ctx.fillStyle = PUTIH;       slab(0, 0);     ctx.fill();
  ctx.save();
  slab(5 * s, 0); ctx.clip();
  ctx.fillStyle = MERAH; slab(0, 0); ctx.fill();       // red field…
  ctx.fillStyle = KUNING_2;                            // …with a gold lower band
  ctx.beginPath();
  ctx.moveTo(x0, h0 * .16); ctx.lineTo(x1, h1 * .16);
  ctx.lineTo(x1, h1); ctx.lineTo(x0, h0);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  const k = (fs + ns) / 2, hm = (h0 + h1) / 2;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = KUNING_2;
  ctx.font = `bold ${Math.round(34 * s * k)}px ${FONT}`;
  ctx.fillText("FINISH", blen / 2, -hm * .34);
  ctx.fillStyle = MERAH;
  ctx.font = `bold ${Math.round(19 * s * k)}px ${FONT}`;
  ctx.fillText("17 AGUSTUS", blen / 2, hm * .55);
  ctx.restore();
  ctx.textBaseline = "alphabetic";
}

// idle sways between Stand and Ready; mid-race it is Ready on the ground,
// Jump in the air
const idlePose = () => (Math.floor(anim * 2.4) % 2) ? "ready" : "stand";
function poseOf(r){
  if(r.air) return "jump";
  if(state === "race" || state === "finish") return r.done ? idlePose() : "ready";
  return idlePose();
}

function drawRacer(r){
  const key = CHARS[r.ci].id + "_" + poseOf(r);
  const im = img[key];
  const sc = laneScale(r.lane), base = laneY(r.lane);
  // on a tall band the lanes are spread wide, so the racers grow with the pitch
  // rather than staying pinned to the scene scale and rattling around in it
  const h = Math.max(SS * .215, PITCH * 1.25) * sc;
  const w = im ? im.width / im.height * h : h * .4;
  const x = r.x - camX - laneOff(r.lane), y = base - r.y * sc;

  // shadow shrinks as the racer rises
  const lift = (r.air ? .55 : 0) + r.y / 40;
  ctx.save();
  ctx.fillStyle = "rgba(30,50,25,.26)";
  ctx.beginPath();
  ctx.ellipse(x, base + 4, w * .3 * (1 - lift * .3), h * .045 * (1 - lift * .25), 0, 0, 7);
  ctx.fill();
  ctx.restore();

  if(im) ctx.drawImage(im, Math.round(x - w / 2), Math.round(y - h), Math.round(w), Math.round(h));

  if(r.human && state !== "title"){
    const ay = y - h - 16 - Math.sin(anim * 6) * 4;
    ctx.beginPath();
    ctx.moveTo(x, ay + 15); ctx.lineTo(x - 13, ay - 5); ctx.lineTo(x + 13, ay - 5);
    ctx.closePath();
    ctx.fillStyle = KUNING_2; ctx.fill();
    ctx.strokeStyle = MERAH; ctx.lineWidth = 3; ctx.stroke();
  }
}

function drawPuffs(){
  for(const p of puffs){
    const k = 1 - p.age / p.life;
    ctx.fillStyle = `rgba(226,214,190,${.5 * k})`;
    ctx.beginPath();
    ctx.arc(p.x - camX - laneOff(p.lane), laneY(p.lane) - p.y, p.r * (1.4 - k * .5) * laneScale(p.lane), 0, 7);
    ctx.fill();
  }
}

/* A hedge of rounded lumps, the shape the ad art frames its bottom corners with.
   Two tones: the mass, then a lighter crown catching the light. */
function bush(x, y, s){
  const lobes = [[-34, 4, 19], [-15, -7, 23], [8, -10, 21], [30, 2, 17], [0, 6, 22]];
  ctx.fillStyle = "#276a34";
  ctx.beginPath();
  for(const [lx, ly, lr] of lobes) ctx.arc(x + lx * s, y + ly * s, lr * s, 0, 7);
  ctx.fill();
  // a thin lit crown, not a second bush — otherwise it reads as a green cloud
  ctx.save();
  ctx.beginPath();
  for(const [lx, ly, lr] of lobes) ctx.arc(x + lx * s, y + ly * s, lr * s, 0, 7);
  ctx.clip();
  ctx.fillStyle = "#37853f";
  ctx.beginPath();
  for(const [lx, ly, lr] of lobes) ctx.arc(x + lx * s, y + (ly - 5) * s, lr * .92 * s, 0, 7);
  ctx.fill();
  ctx.restore();
}

// near bank of grass in front of the track, for depth
function drawForeground(){
  // a thin bank: the reference runs its track to the bottom edge, so this is
  // only enough to close the frame, not a second field
  const s = SS / 720, top = Math.max(laneY(0) + 26 * s, H - 62 * s);
  if(top >= H) return;
  const shift = -((camX * 1.18) % 160);

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-20, H);
  ctx.lineTo(-20, top);
  for(let x = -20; x <= W + 180; x += 80){
    ctx.quadraticCurveTo(x + 20 + shift, top - 11 * s, x + 80 + shift, top);
  }
  ctx.lineTo(W + 180, H);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, top, 0, H);
  g.addColorStop(0, "#57a35a"); g.addColorStop(1, "#3f8144");
  ctx.fillStyle = g; ctx.fill();

  ctx.clip();
  // bushes are sunk into the bank so only their crowns show, and spaced out —
  // a solid hedge would read as a wall across the bottom of the frame
  for(let i = 0; i < 14; i++){
    const wx = i * 430 + (i % 4) * 95;
    const x = ((wx - camX * 1.18) % 6020 + 6020) % 6020 - 340;
    if(x < -180 || x > W + 180) continue;
    bush(x, top + (34 + (i % 3) * 7) * s, s * (.78 + (i % 4) * .17));
  }
  ctx.strokeStyle = "rgba(38,92,44,.65)"; ctx.lineWidth = 2.2 * s; ctx.lineCap = "round";
  for(let i = 0; i < 46; i++){
    const wx = i * 88 + (i % 7) * 13;
    const x = ((wx - camX * 1.18) % 4048 + 4048) % 4048 - 260;
    if(x < -30 || x > W + 30) continue;
    tuft(x, top + (8 + (i % 3) * 8) * s, s * 1.35);
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* the drawn twin of the .badge class: gold gradient, white keyline, hard
   offset shadow. Everything the HUD frames is built out of this one shape. */
function badgePanel(x, y, w, h, r){
  const b = Math.max(2, r * .42), sh = r * .62;
  ctx.fillStyle = EMAS_BAYANG;
  roundRect(x, y + sh, w, h, r); ctx.fill();
  ctx.fillStyle = PUTIH;
  roundRect(x, y, w, h, r); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, KUNING_1); g.addColorStop(1, KUNING_2);
  ctx.fillStyle = g;
  roundRect(x + b, y + b, w - b * 2, h - b * 2, Math.max(1, r - b)); ctx.fill();
}

/* ---- chrome ---------------------------------------------------------------
   The band is framed by two solid red panels, the way every screen in the ad
   creative is: the strip above carries the HUD as separate pills, the strip
   below is one big control surface. Everything here is drawn in screen pixels
   at HS, so it fills the letterbox instead of shrinking with the band. */

const MERAH_DALAM = "#c9171e";      // the panel red, a shade under --merah

function redPanel(x, y, w, h, r){
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#ea4148"); g.addColorStop(1, MERAH_DALAM);
  ctx.fillStyle = g;
  if(r){ roundRect(x, y, w, h, r); ctx.fill(); } else ctx.fillRect(x, y, w, h);
}

/* the confetti flecks scattered over the red panels in the ad creative */
function panelFlecks(x, y, w, h){
  const s = HS, cols = [KUNING_2, PUTIH, "#ff9a9e", "#4aa3e0"];
  ctx.save();
  ctx.globalAlpha = .38;
  for(let i = 0; i < 22; i++){
    const px = x + ((i * 67) % 100) / 100 * w, py = y + ((i * 43) % 100) / 100 * h;
    const d = (4 + (i % 3) * 2) * s;
    ctx.save();
    ctx.translate(px, py); ctx.rotate(i * 1.13);
    ctx.fillStyle = cols[i % cols.length];
    if(i % 3 === 0){
      ctx.beginPath();
      ctx.moveTo(0, -d); ctx.lineTo(d * .7, 0); ctx.lineTo(0, d); ctx.lineTo(-d * .7, 0);
      ctx.closePath(); ctx.fill();
    } else ctx.fillRect(-d / 2, -d / 3, d, d * .66);
    ctx.restore();
  }
  ctx.restore();
}

/* one HUD pill: a seated shadow, the fill, then an optional keyline */
function chip(x, y, w, h, fill, line){
  const s = HS;
  ctx.fillStyle = "rgba(112,10,14,.45)";
  roundRect(x, y + 3 * s, w, h, h / 2); ctx.fill();
  ctx.fillStyle = fill;
  roundRect(x, y, w, h, h / 2); ctx.fill();
  if(line){
    ctx.strokeStyle = line; ctx.lineWidth = 2.6 * s;
    roundRect(x + 1.3 * s, y + 1.3 * s, w - 2.6 * s, h - 2.6 * s, (h - 2.6 * s) / 2);
    ctx.stroke();
  }
}

function drawTopBar(){
  const me = racers[0], s = HS;
  const h = 38 * s;                                  // pill height
  // a deep enough letterbox becomes the bar; otherwise the bar floats on the scene
  const banded = letterboxed && bandTop >= safeT + h + 18 * s;
  let rowY;
  if(banded){
    redPanel(0, 0, SW, bandTop);
    panelFlecks(0, safeT, SW, bandTop - safeT);
    ctx.fillStyle = "rgba(120,12,16,.45)";
    ctx.fillRect(0, bandTop - 3 * s, SW, 3 * s);
    rowY = safeT + (bandTop - safeT - h) / 2;
  } else {
    rowY = safeT + 14 * s;
    redPanel(10 * s, rowY - 8 * s, SW - muteReserve - 4 * s, h + 16 * s, (h + 16 * s) / 2);
  }

  const left = (banded ? 14 : 20) * s;
  const right = SW - muteReserve;
  const gap = 7 * s;
  const placeW = 74 * s, timeW = 82 * s;
  const railW = Math.max(56 * s, right - left - placeW - timeW - gap * 2);

  // place: gold trophy on red, as in the reference
  const place = 1 + racers.filter(o => o.x > me.x).length;
  chip(left, rowY, placeW, h, MERAH_DALAM, "rgba(255,222,59,.9)");
  trophy(left + 18 * s, rowY + h / 2, s * 1.05, "rgba(120,12,16,.8)");
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = PUTIH;
  ctx.font = `bold ${Math.round(23*s)}px ${FONT}`;
  ctx.fillText(["", "1st", "2nd", "3rd", "4th"][place], left + 33 * s, rowY + h / 2 + s);

  // time: white pill
  const tx = left + placeW + gap;
  chip(tx, rowY, timeW, h, PUTIH, "rgba(143,20,25,.18)");
  stopwatch(tx + 19 * s, rowY + h / 2, s * 1.05);
  ctx.fillStyle = INK;
  ctx.font = `bold ${Math.round(21*s)}px ${FONT}`;
  ctx.fillText(clock.toFixed(1) + "s", tx + 33 * s, rowY + h / 2 + s);

  // progress: a gold fill running towards a chequered flag
  const rx = tx + timeW + gap, ip = 5 * s, ih = h - ip * 2, iw = railW - ip * 2;
  chip(rx, rowY, railW, h, PUTIH, "rgba(143,20,25,.18)");
  ctx.save();
  roundRect(rx + ip, rowY + ip, iw, ih, ih / 2); ctx.clip();
  ctx.fillStyle = "#e7ddc6"; ctx.fillRect(rx + ip, rowY + ip, iw, ih);
  const t = clamp((me.x - START_X) / (RACE_LEN - START_X), 0, 1);
  const gg = ctx.createLinearGradient(0, rowY + ip, 0, rowY + ip + ih);
  gg.addColorStop(0, KUNING_1); gg.addColorStop(1, KUNING_2);
  ctx.fillStyle = gg;
  roundRect(rx + ip, rowY + ip, Math.max(ih, t * iw), ih, ih / 2); ctx.fill();
  for(const r of racers){                            // the pack, as small ticks
    if(r.human) continue;
    const rt = clamp((r.x - START_X) / (RACE_LEN - START_X), 0, 1);
    ctx.fillStyle = "rgba(49,31,23,.30)";
    ctx.beginPath(); ctx.arc(rx + ip + rt * iw, rowY + h / 2, 3.2 * s, 0, 7); ctx.fill();
  }
  const fc = ih / 2;                                 // chequered flag on the end
  for(let r = 0; r < 2; r++) for(let c = 0; c < 3; c++){
    ctx.fillStyle = (r + c) % 2 ? INK : "#efe6d2";
    ctx.fillRect(rx + ip + iw - fc * 3 + c * fc, rowY + ip + r * fc, fc, fc);
  }
  ctx.restore();

  // combo hangs under the bar so the row above never reflows mid-race
  if(me.combo > 1){
    const cw = 108 * s, ch = 24 * s, cy = (banded ? bandTop : rowY + h + 10 * s) + 8 * s;
    chip(left, cy, cw, ch, KUNING_2, PUTIH);
    ctx.textAlign = "center"; ctx.fillStyle = MERAH_TUA;
    ctx.font = `bold ${Math.round(15*s)}px ${FONT}`;
    ctx.fillText("COMBO x" + me.combo, left + cw / 2, cy + ch / 2 + s);
  }
  ctx.textBaseline = "alphabetic";
}

/* Two glyphs for the HUD, drawn rather than typed: the emoji the reference
   leans on render differently on every platform and would break the lockup. */
function trophy(cx, cy, s, line){
  ctx.save();
  ctx.strokeStyle = line || MERAH_TUA; ctx.lineWidth = 2 * s; ctx.lineJoin = "round";
  ctx.fillStyle = "#ffd23f";
  ctx.beginPath();                                   // cup
  ctx.moveTo(cx - 7 * s, cy - 9 * s); ctx.lineTo(cx + 7 * s, cy - 9 * s);
  ctx.lineTo(cx + 5 * s, cy - 1 * s);
  ctx.quadraticCurveTo(cx, cy + 3 * s, cx - 5 * s, cy - 1 * s);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();                                   // handles
  ctx.arc(cx - 8 * s, cy - 6 * s, 3.4 * s, Math.PI * .5, Math.PI * 1.6);
  ctx.moveTo(cx + 8 * s + 3.4 * s, cy - 6 * s);
  ctx.arc(cx + 8 * s, cy - 6 * s, 3.4 * s, Math.PI * 1.4, Math.PI * .5);
  ctx.stroke();
  ctx.fillStyle = "#ffd23f";
  ctx.fillRect(cx - 1.6 * s, cy + 1 * s, 3.2 * s, 4 * s);   // stem
  roundRect(cx - 5 * s, cy + 5 * s, 10 * s, 3.4 * s, 1.4 * s); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function stopwatch(cx, cy, s){
  ctx.save();
  ctx.strokeStyle = MERAH_TUA; ctx.lineWidth = 2 * s; ctx.lineCap = "round";
  ctx.fillStyle = PUTIH;
  ctx.beginPath(); ctx.arc(cx, cy + 1 * s, 6.6 * s, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - 2.6 * s, cy - 7.6 * s); ctx.lineTo(cx + 2.6 * s, cy - 7.6 * s);   // crown
  ctx.moveTo(cx, cy + 1 * s); ctx.lineTo(cx, cy - 2.6 * s);                          // hands
  ctx.moveTo(cx, cy + 1 * s); ctx.lineTo(cx + 3 * s, cy + 1 * s);
  ctx.stroke();
  ctx.restore();
}

/* The strip below the band is thumb country, so the whole panel is the control
   surface: red like the top bar, bushes tucked into its corners, and the gold
   button sitting on it. The button doubles as a rhythm cue — bright the moment
   the racer lands and is ready for the next hop, dim while airborne or tripped. */
function drawBottomBar(){
  const me = racers[0], s = HS;
  const top = bandTop + bandH, zone = SH - top;
  if(zone < 56 * s) return;

  redPanel(0, top, SW, zone);
  ctx.fillStyle = "rgba(120,12,16,.45)";
  ctx.fillRect(0, top, SW, 3 * s);
  panelFlecks(0, top, SW, zone - safeB);

  // the hedge the creative closes every frame with
  ctx.save();
  ctx.beginPath(); ctx.rect(0, top, SW, zone); ctx.clip();
  bush(26 * s, SH + 6 * s, s * 1.25);
  bush(SW - 30 * s, SH + 10 * s, s * 1.5);
  ctx.restore();

  if(zone < 90 * s) return;
  const h = clamp(zone * .34, 76 * s, 150 * s);
  const w = Math.min(SW - 44 * s, 440 * s);
  const cy = top + (zone - safeB) * .42;
  const ready = state === "race" && !me.air && me.lock <= 0 && !me.done;

  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.globalAlpha = ready ? 1 : .68;
  badgePanel((SW - w) / 2, cy - h / 2, w, h, 14 * s);
  // the gloss the ad's buttons carry across their top third
  ctx.fillStyle = "rgba(255,255,255,.5)";
  roundRect((SW - w) / 2 + 16 * s, cy - h / 2 + 12 * s, w * .46, h * .24, h * .12);
  ctx.fill();
  ctx.fillStyle = INK;
  ctx.font = `bold ${Math.round(42*s)}px ${FONT}`;
  ctx.fillText(me.done ? "SELESAI" : "TAP!", SW / 2, cy);
  ctx.restore();

  // the caption the reference carries under its button
  const capY = cy + h / 2 + 22 * s;
  if(capY < SH - safeB - 8 * s){
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `bold ${Math.round(15*s)}px ${FONT}`;
    ctx.fillStyle = "rgba(120,12,16,.55)";
    roundRect(SW / 2 - w * .35, capY - 14 * s, w * .7, 28 * s, 14 * s); ctx.fill();
    ctx.fillStyle = PUTIH;
    ctx.fillText("Terus tap untuk melompat!", SW / 2, capY);
    ctx.restore();
  }
}

function drawHud(){
  if(state === "title" || state === "email" || state === "select" || state === "done") return;

  ctx.save();
  screenSpace();
  if(letterboxed) drawBottomBar();
  drawTopBar();
  ctx.restore();

  // the overlays belong on the action, so they stay in band space
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const s = SS / 720;

  ctx.textAlign = "center";
  if(state === "countdown"){
    const n = Math.ceil(countdown);
    const t = 1 - (countdown - Math.floor(countdown));
    const cy = H * .44;
    ctx.save();
    ctx.globalAlpha = clamp(1.4 - t, 0, 1);
    // radiating ticks, as in the reference: they pop out as each numeral lands
    ctx.strokeStyle = PUTIH; ctx.lineCap = "round";
    ctx.lineWidth = 7 * s;
    const ry = cy - 40 * s, rIn = (86 + (1 - t) * 30) * s, rOut = rIn + 26 * s;
    for(let k = -1; k <= 1; k++){
      for(const dir of [-1, 1]){
        const a = k * .42;
        ctx.beginPath();
        ctx.moveTo(W/2 + dir * Math.cos(a) * rIn, ry + Math.sin(a) * rIn);
        ctx.lineTo(W/2 + dir * Math.cos(a) * rOut, ry + Math.sin(a) * rOut);
        ctx.stroke();
      }
    }
    ctx.font = `bold ${Math.round((150 + (1-t)*60)*s)}px ${FONT}`;
    ctx.lineJoin = "round";
    ctx.fillStyle = MERAH; ctx.strokeStyle = PUTIH; ctx.lineWidth = 14 * s;
    const txt = n > 0 ? String(n) : "MULAI!";
    ctx.save();
    ctx.translate(0, 6 * s);
    ctx.fillStyle = "rgba(90,16,20,.28)";                       // seated shadow
    ctx.fillText(txt, W/2, cy);
    ctx.restore();
    ctx.fillStyle = MERAH;
    ctx.strokeText(txt, W/2, cy); ctx.fillText(txt, W/2, cy);
    ctx.restore();
  } else if(state === "race" && clock < 1.6 && !letterboxed){
    // letterboxed, the tap pad below the band already says this, permanently
    ctx.save();
    ctx.lineJoin = "round";
    ctx.font = `bold ${Math.round(26*s)}px ${FONT}`;
    ctx.fillStyle = MERAH; ctx.strokeStyle = PUTIH; ctx.lineWidth = 5 * s;
    ctx.strokeText("TAP! TAP! TAP!", W/2, H * .3);
    ctx.fillText("TAP! TAP! TAP!", W/2, H * .3);
    ctx.restore();
  }

  if(banner){
    ctx.save();
    ctx.globalAlpha = clamp(banner.life * 2.4, 0, 1);   // hold, then fade fast
    ctx.font = `bold ${Math.round(56*s)}px ${FONT}`;
    ctx.lineJoin = "round";
    ctx.fillStyle = KUNING_2; ctx.strokeStyle = MERAH_TUA; ctx.lineWidth = 9 * s;
    ctx.strokeText(banner.text, W/2, H * .17); ctx.fillText(banner.text, W/2, H * .17);
    ctx.restore();
  }

  if(flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${flash * .5})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function render(){
  ctx.save();
  screenSpace();
  ctx.clearRect(0, 0, SW, SH);       // clears the strips too, not just the band
  ctx.restore();
  // the menus stand on #backdrop, which is behind the canvas — drawing the race
  // underneath them would only cost frames
  if(state === "title" || state === "email" || state === "select") return;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();   // keep the scene in its band
  drawSky(); drawHills(); drawBunting(); drawCrowd(); drawConfetti();
  drawField(); drawStartLine(); drawFinish();
  drawPuffs();
  for(let lane = 3; lane >= 0; lane--){
    const r = racers.find(o => o.lane === lane);
    if(r) drawRacer(r);
  }
  drawForeground();
  ctx.restore();

  drawHud();
}

/* ---------------------------------------------------------------- the loop */

let last = performance.now();
function frame(now){
  const dt = Math.min((now - last) / 1000, .05);
  last = now;
  resize();          // cheap, and self-cancels unless the viewport really changed
  anim += dt;
  step(dt);
  render();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------- flow */

/* The picker slides rather than tiles: the chosen racer stands front-on in the
   middle and the others peek in from either side. Drag, arrows, dots and the
   arrow keys all end up in setPick(). `drag` is measured in slots, so a
   half-swiped carousel is just pick + 0.5. */
let slides = [], drag = 0, dragMoved = false;

const SLOT = () => (slides[0] ? slides[0].offsetWidth : 120) * 1.16;   // px per slot

function layoutPicker(){
  const gap = SLOT();
  slides.forEach((el, i) => {
    const o = i - pick - drag, k = Math.min(Math.abs(o), 2);
    el.style.transform = `translateX(calc(-50% + ${o * gap}px)) scale(${1 - k * .24})`;
    el.style.opacity   = Math.abs(o) > 2.05 ? 0 : 1 - k * .42;
    el.style.filter    = `brightness(${1 - k * .28})`;
    el.style.zIndex    = 100 - Math.round(k * 40);
    el.classList.toggle("on", i === pick && !drag);
  });
}

function setPick(i, quiet){
  i = clamp(Math.round(i), 0, CHARS.length - 1);
  const changed = i !== pick;
  pick = i;
  if(changed && !quiet) beep(700, .07, "square", .05);

  const np = $("nameplate");
  $("pick-name").textContent = CHARS[pick].name;
  $("pick-tag").textContent  = CHARS[pick].tag;
  if(changed){ np.classList.remove("pop"); void np.offsetWidth; np.classList.add("pop"); }

  [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === pick));
  $("prev").classList.toggle("dim", pick === 0);
  $("next").classList.toggle("dim", pick === CHARS.length - 1);
  layoutPicker();
  makeRacers();
}

function buildPicker(){
  const track = $("track"), dots = $("dots");
  track.innerHTML = ""; dots.innerHTML = "";
  slides = CHARS.map((c, i) => {
    const el = document.createElement("div");
    el.className = "slide";
    el.innerHTML = `<img src="sprites/${c.id}_hero.png" alt="${c.name}" draggable="false">`;
    el.onclick = () => { if(!dragMoved) setPick(i); };   // tap a neighbour to bring it in
    track.appendChild(el);

    const d = document.createElement("button");
    d.type = "button"; d.setAttribute("aria-label", c.name);
    d.onclick = () => setPick(i);
    dots.appendChild(d);
    return el;
  });
  setPick(pick, true);
}

/* swipe / click-drag */
(function(){
  const box = $("carousel"), track = $("track");
  let id = null, x0 = 0, gap = 1;

  box.addEventListener("pointerdown", e => {
    if(id !== null || e.target.closest(".arrow")) return;
    id = e.pointerId; x0 = e.clientX; gap = SLOT();
    drag = 0; dragMoved = false;
    box.setPointerCapture(id);
    track.classList.add("dragging");
    box.classList.add("grabbing");
  });

  box.addEventListener("pointermove", e => {
    if(e.pointerId !== id) return;
    if(Math.abs(e.clientX - x0) > 6) dragMoved = true;
    let d = (x0 - e.clientX) / gap;
    // rubber band once you pull past either end of the line-up
    d -= ((pick + d) - clamp(pick + d, 0, CHARS.length - 1)) * .62;
    drag = d;
    layoutPicker();
  });

  const release = e => {
    if(id === null || e.pointerId !== id) return;
    box.releasePointerCapture(id);
    id = null;
    track.classList.remove("dragging");
    box.classList.remove("grabbing");
    const steps = Math.abs(drag) < .28 ? 0 : Math.sign(drag) * Math.max(1, Math.round(Math.abs(drag)));
    drag = 0;
    setPick(pick + steps);
  };
  box.addEventListener("pointerup", release);
  box.addEventListener("pointercancel", release);

  $("prev").onclick = () => setPick(pick - 1);
  $("next").onclick = () => setPick(pick + 1);
  window.addEventListener("resize", layoutPicker);
})();

// the slides have no width until the layer is on screen, so lay out after show()
function toSelect(){ state = "select"; makeRacers(); show("scr-select"); layoutPicker(); }

function startRace(){
  makeRacers();
  state = "countdown"; countdown = 3.05; clock = 0;
  show("scr-race");
}

function endRace(){
  state = "done";
  const key = r => r.done ? r.time : 1e6 - r.x;
  const board = [...racers].sort((a,b) => key(a) - key(b));
  const meIdx = board.findIndex(r => r.human);
  $("verdict").textContent = ["JUARA 1! 🏆", "Juara 2 👏", "Juara 3 🙂", "Belum beruntung 😅"][meIdx];
  $("board").innerHTML = board.map((r, i) =>
    `<div class="rowline${r.human ? " me" : ""}">
       <span class="pos">${i + 1}</span>
       <img src="sprites/${CHARS[r.ci].id}_hero.png" alt="">
       <span>${CHARS[r.ci].name}${r.human ? " (kamu)" : ""}</span>
       <span>${r.done ? r.time.toFixed(2) + "s" : "—"}</span>
     </div>`).join("");
  // everyone who finishes keeps the prize their email drew — placing does not gate it
  $("prize-text").textContent = prize;
  $("prize").style.display = prize ? "" : "none";
  meIdx === 0 ? sfxWin() : sfxLose();
  show("scr-done");
}

function toEmail(){
  state = "email";
  show("scr-email");
  $("email-input").focus({ preventScroll: true });
}

/* The prize is claimed here, before the race, for two reasons: the network round
   trip hides behind the character picker instead of stalling the payoff, and a
   failure surfaces while the player has invested nothing. */
$("email-form").onsubmit = async ev => {
  ev.preventDefault();
  const input = $("email-input"), note = $("email-note"), btn = $("btn-email");
  const email = input.value.trim();
  note.classList.remove("bad"); input.classList.remove("bad");

  if(!EMAIL_RE.test(email)){
    input.classList.add("bad"); note.classList.add("bad");
    note.textContent = "Alamat email belum benar.";
    input.focus();
    return;
  }

  btn.disabled = true;
  note.textContent = "Mengunci hadiah…";
  try {
    const res = await claimPrize(email);
    if(!res.ok) throw new Error(res.error || "gagal");
    prize = res.prize;
    note.textContent = res.returning ? "Email ini sudah pernah main — hadiahmu tetap sama." : "";
    beep(660,.1,"square",.06);
    toSelect();
  } catch (err) {
    note.classList.add("bad");
    note.textContent = "Gagal menyimpan. Cek koneksi lalu coba lagi.";
    console.error("lead capture failed:", err);
  } finally {
    btn.disabled = false;
  }
};

$("btn-play").onclick   = () => { beep(660,.1,"square",.06); toEmail(); };
$("btn-go").onclick     = () => { beep(660,.1,"square",.06); startRace(); };
$("btn-again").onclick  = () => startRace();
$("btn-change").onclick = () => toSelect();

const zone = $("tapzone");
zone.addEventListener("pointerdown", e => { e.preventDefault(); tap(); });
window.addEventListener("keydown", e => {
  if(e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter"){
    e.preventDefault();
    if(state === "title") toSelect();
    else if(state === "select") startRace();
    else if(state === "done") startRace();
    else tap();
  }
  if(state === "select" && (e.code === "ArrowLeft" || e.code === "ArrowRight")){
    setPick(pick + (e.code === "ArrowRight" ? 1 : -1));
  }
});

/* ------------------------------------------------------------------ boot */

CHARS.forEach(c => POSES.forEach(p => {
  const im = new Image();
  im.src = `sprites/${c.id}_${p}.png`;
  img[c.id + "_" + p] = im;
}));

// canvas text silently falls back until the face is actually loaded, and
// nothing else on the title screen forces the bold weight early enough
if(document.fonts) document.fonts.load('700 40px "IBM Plex Sans"');

buildPicker();
makeRacers();
resize();
show("scr-title");
requestAnimationFrame(frame);
</script>
</body>
</html>
